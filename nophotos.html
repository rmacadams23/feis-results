<!DOCTYPE html>
<html lang="en">
<head>

  <title>Feis Live Results — Tabulation</title>
<style>
  :root { --ink:#1d2733; --muted:#6b7785; --line:#dde3ea; --bg:#f4f6f9; --pri:#146c43; --pri2:#0f5132; --warn:#b54708; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Calibri,system-ui,sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header.bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }

  input.bad { border-color:var(--bad); background:#fff3f2; }

    .tbl.dancers td { border:0; padding:0; }
    .tbl.dancers td:nth-child(4) { grid-column:2 / 4; }
    .tbl.dancers td:nth-child(5) { grid-column:4; }
    .tbl.dancers td:nth-child(6) { grid-row:1; grid-column:4; }
    .tbl.dancers .w-s { max-width:none; }
    .nm { display:block; font-size:12px; color:var(--muted); font-weight:400; }
    .hide-m { display:none; }
    .judgeTabs button { flex:1 1 30%; padding:8px 6px; }
    .showgrid > div:first-child { order:2; }
    #nextBtn { position:sticky; bottom:10px; z-index:3; box-shadow:0 6px 18px rgba(0,0,0,.25); }
    .ctl.keys { display:none; }
  }
</style>
</head>

const PhotoDB = (() => {

  return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)).catch(() => {}) };

function shrinkPhoto(file, max, q){

const labelPayload = (c, j) => `F1|${c.id}|${j}`;   // short = small, easy-to-read QR
function readLabel(file){
  return new Promise(res => {
    if (typeof jsQR !== 'function') return res(null);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      for (const max of [2400, 1600, 1000]) {
        const k = Math.min(1, max/Math.max(img.width, img.height)), w = Math.round(img.width*k), h = Math.round(img.height*k);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d', { willReadFrequently:true }); cx.drawImage(img, 0, 0, w, h);
        const hit = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:'dontInvert' });
        if (hit && hit.data && hit.data.startsWith('F1|')) {
          const [, id, j] = hit.data.split('|'); const c = getComp(id);
          return res(c && +j < c.judges.length ? { c, j:+j } : { unknown: true });
        }
      }
      res(null);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

/* ---------------- Read-back verification ---------------- */
function entryText(c, j, d){
  const e = c.scores[j]?.[d.id];
  if (c.entry === 'place') { const v = (e?.place ?? '').toString().trim(); return v ? ord(+v) || v : ''; }
  const r = Array.from({length:c.rounds}, (_, i) => (e?.r?.[i] ?? '').toString().trim());
  return r.some(x => x === '') ? '' : r.join(' + ');
}
const sigOf = (c, j) => JSON.stringify([c.entry, c.rounds, live(c).map(d => [d.id, entryText(c, j, d)])]);
function isVerified(c, j){ const v = c.verified?.[j]; return !!v && v.sig === sigOf(c, j); }

/* ---------------- Scoring ---------------- */
const pointsAt = p => state.settings.points[p-1] ?? 0;
function sharedPoints(start, k){ let s=0; for(let i=0;i<k;i++) s+=pointsAt(start+i); return r2(s/k); }

function judgeResults(c, j){
  const out = {}; const sc = c.scores[j] || {};
  if (c.entry === 'place') {
    const list = [];
    live(c).forEach(d => { const p = num(sc[d.id]?.place); const ok = Number.isInteger(p) && p>0; out[d.id] = { total:null, rank: ok?p:null, pts:null, tie:false }; if(ok) list.push({id:d.id,p}); });
    const counts = {}; list.forEach(x => counts[x.p] = (counts[x.p]||0)+1);
    list.forEach(x => { const k = counts[x.p]; out[x.id].pts = sharedPoints(x.p, k); out[x.id].tie = k>1; });
  } else {
    const list = [];
    live(c).forEach(d => {
      const r = sc[d.id]?.r || []; let t=0, ok=true;
      for (let i=0;i<c.rounds;i++){ const v=num(r[i]); if(isNaN(v)){ ok=false; break; } t+=v; }
      out[d.id] = { total: ok ? r2(t) : null, rank:null, pts:null, tie:false };
      if (ok) list.push({ id:d.id, t:r2(t) });
    });
    list.sort((a,b) => b.t-a.t);
    let i=0;
    while (i<list.length){
      let k=1; while (i+k<list.length && list[i+k].t===list[i].t) k++;
      const pts = sharedPoints(i+1, k);
      for (let m=0;m<k;m++){ const o=out[list[i+m].id]; o.rank=i+1; o.pts=pts; o.tie=k>1; }
      i+=k;
    }
  }
  return out;
}
function judgeComplete(c, j){ const r = judgeResults(c,j); return live(c).filter(d => r[d.id].pts!=null).length; }
function overall(c){
  const jr = c.judges.map((_,j) => judgeResults(c,j));
  const rows = live(c).map(d => {
    let tot=0, complete=true;
    const pts = jr.map(r => { const p = r[d.id]?.pts; if (p==null) complete=false; else tot+=p; return p ?? null; });
    return { d, pts, total:r2(tot), complete, place:null, tie:false };
  });
  const ranked = rows.filter(r => r.complete).sort((a,b) => b.total-a.total);
  ranked.forEach((r,i) => {
    if (i>0 && ranked[i-1].total===r.total){ r.place = ranked[i-1].place; r.tie = ranked[i-1].tie = true; }
    else r.place = i+1;
  });
  return { jr, rows, ranked };
}
const placesN = c => c.places>0 ? c.places : c.places<0 ? live(c).length : Math.ceil(live(c).length/2);
function resultList(c){ const N=placesN(c); return overall(c).ranked.filter(r => r.place<=N); }

const SHELL = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Results Display</title><style>${DISPLAY_CSS}</style></head>
<body><div id="root"></div><div id="hint">Double-click or press F for full screen</div><script>
function fs(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }
document.addEventListener('dblclick', fs);
document.addEventListener('keydown', function(e){
  if(e.key==='f'||e.key==='F'){ fs(); return; }
  try { var h = window.opener || (window.parent!==window ? window.parent : null); if(h && h.feisKey && h.feisKey(e.key)) e.preventDefault(); } catch(_){}
});
document.addEventListener('click', function(e){ try { if(window.parent!==window && window.parent.feisTap) window.parent.feisTap(e.clientX/window.innerWidth); } catch(_){} });
if(window.frameElement){ document.getElementById('hint').style.display='none'; }
setTimeout(function(){ var h=document.getElementById('hint'); if(h) h.style.opacity=0; }, 5000);
<\/script></body></html>`;

function logoHTML(src){ return `<div class="logo">${src ? `<img src="${src}" alt="">` : ''}</div>`; }
function frame(inner){
  const s = state.settings;
  return `<div class="stage" style="--bg:${esc(s.bg)};--acc:${esc(s.acc)}"><div class="band"></div><div class="content">${inner}</div><div class="band"></div></div>`;
}
function header(c){
  const s = state.settings;
  return `<div class="top">${logoHTML(s.logoL)}<div class="titles"><div class="ev">${esc(s.eventName)}</div><h1>${esc(c.name)}</h1></div>${logoHTML(s.logoR)}</div><div class="rule"></div>`;
}
function rowH(n){ return Math.max(2.2, Math.min(8, 68/(n+1.4))) + 'vh'; }

function titleHTML(c, sub){
  const s = state.settings;
  return frame(`<div class="hero"><div class="logos">${logoHTML(s.logoL)}${logoHTML(s.logoR)}</div>
    <div><div class="ev">${esc(s.eventName)}</div>${c ? `<h1>${esc(c.name)}</h1>` : ''}${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>`);
}
function gridHTML(c, anim){
  const v=c.view, D=live(c).length, J=c.judges.length;
  if (!D) return frame(header(c) + `<div class="empty">No dancers entered yet</div>`);
  const jr = c.judges.map((_,j) => judgeResults(c,j));
  const newest = anim && v.gridStep>0 && v.lastReveal==='cell' ? v.gridStep-1 : -1;
  const totAnim = anim && v.lastReveal==='totals';
  let h = `<table class="grid" style="--rh:${rowH(D)}"><colgroup><col style="width:15%">${c.judges.map(()=>'<col>').join('')}<col style="width:17%"></colgroup>
    <thead><tr><th>Dancer No</th>${c.judges.map((n,j)=>`<th><span class="aw">Adjudicator</span><span class="jw">Judge</span> ${j+1}<small>${esc(n)}</small></th>`).join('')}<th>Grid Total</th></tr></thead><tbody>`;
  live(c).forEach((d,i) => {
    h += `<tr><td class="no">${esc(d.no)}</td>`;
    let tot=0, allShown=true, complete=true;
    for (let j=0;j<J;j++){
      const idx=j*D+i, shown = idx < v.gridStep, p = jr[j][d.id]?.pts;
      if (p==null) complete=false; else tot+=p;
      if (!shown) allShown=false;
      h += shown ? `<td class="${idx===newest?'new':''}">${p==null?'—':fmt(p)}</td>` : `<td class="hid"></td>`;
    }
    h += v.showTotals ? `<td class="tot ${totAnim?'new':''}">${complete?fmt(r2(tot)):'—'}</td>` : `<td class="hid"></td>`;
    h += `</tr>`;
  });
  return frame(header(c) + h + `</tbody></table>`);
}
function resultsHTML(c, anim){
  const v=c.view, list=resultList(c), L=list.length, k=Math.min(v.resStep, L);
  if (!L) return frame(header(c) + `<div class="empty">Results not ready</div>`);
  const shown = i => v.order==='bottom' ? i >= L-k : i < k;
  const newest = anim && k>0 && v.lastReveal==='row' ? (v.order==='bottom' ? L-k : k-1) : -1;
  const allAnim = anim && v.lastReveal==='allrows';
  let h = `<table style="--rh:${rowH(L)}"><colgroup><col style="width:9%"><col style="width:12%"><col style="width:32%"><col><col style="width:13%"></colgroup>
    <thead><tr><th>Place</th><th>Dancer No</th><th>Competitor</th><th class="sch">Dance School</th><th>Grid Total</th></tr></thead><tbody>`;
  list.forEach((r,i) => {
    const s = shown(i);
    const cls = !s ? 'hidrow' : `p${r.place} ${(i===newest||allAnim)?'newrow':''}`;
    h += `<tr class="${cls}"><td class="place">${s?ord(r.place)+(r.tie?'=':''):''}</td><td class="no">${s?esc(r.d.no):''}</td><td class="left">${s?esc(r.d.name):''}</td><td class="left sch">${s?esc(r.d.school):''}</td><td class="tot">${s?fmt(r.total):''}</td></tr>`;
  });
  return frame(header(c) + h + `</tbody></table>`);
}
function dispHTML(anim){
  const c = liveComp();
  if (!c) return titleHTML(null, 'Results will appear here');
  switch (c.view.screen){
    case 'grid': return gridHTML(c, anim);
    case 'results': return resultsHTML(c, anim);
    case 'blank': return titleHTML(null, 'Results will appear here shortly');
    default: return titleHTML(c, 'Results');
  }
}

let dispWin = null;
function ensureShell(doc){ if (!doc.getElementById('root')) { doc.open(); doc.write(SHELL); doc.close(); } }
function pushTo(doc){
  if (!doc) return; const root = doc.getElementById('root'); if (!root) return;
  const c = liveComp(); const flash = c ? c.view.flash : 0;
  const anim = !!flash && doc.__flash !== flash;
  const html = dispHTML(anim);
  if (html === doc.__html) return;
  root.innerHTML = html; doc.__html = html; doc.__flash = flash;
}
function pushDisplay(){
  if (dispWin && !dispWin.closed) { try { pushTo(dispWin.document); } catch(e){} }
  const pv = document.getElementById('pv');
  if (pv && pv.contentDocument) pushTo(pv.contentDocument);
  const pov = document.getElementById('pov');
  if (pov.__ready && document.getElementById('presentOv').classList.contains('on')) pushTo(pov.contentDocument);
  updateStatus();
}
function openDisplay(){
  dispWin = window.open('', 'feisLiveDisplay', 'width=1280,height=720');
  if (!dispWin) { toast('A separate display window can’t open here — use “Present on this device” on the Show tab instead.'); return; }
  ensureShell(dispWin.document); dispWin.document.__html = null;
  pushDisplay(); dispWin.focus();
}
function updateStatus(){
  const el = document.getElementById('dispStatus'); const on = dispWin && !dispWin.closed;
  el.className = 'status ' + (on?'on':'off'); el.textContent = on ? 'Display window open' : 'Display not open';
  document.getElementById('openDisp').textContent = on ? 'Bring display to front' : 'Open display window';
}
setInterval(updateStatus, 1500);

/* ---------------- Show controls ---------------- */
function flash(c, kind){ c.view.flash = (c.view.flash||0)+1; c.view.lastReveal = kind; }
function act(fn){ const c = liveComp(); if(!c) return; fn(c, c.view); save(); pushDisplay(); if (state.tab==='show') updateShowCtl(); }
async function okToReveal(c, judges){
  const bad = judges.filter(j => !isVerified(c, j) && !(c.view.ov||{})[j]);
  if (!bad.length) return true;
  const names = bad.map(j => `Adjudicator ${j+1}`).join(', ');
  const go = await dialog({ title:'Scores not verified', text:`${names} ${bad.length>1?'haven’t':'hasn’t'} been read back yet. Reveal anyway?`, ok:'Reveal anyway', danger:true });
  if (go) { c.view.ov = c.view.ov || {}; bad.forEach(j => c.view.ov[j] = true); save(); }
  return go;
}
async function next(){
  const c0 = liveComp(); if (!c0) return;
  const v0 = c0.view, D0 = live(c0).length, J0 = c0.judges.length;
  if (v0.screen==='grid' && v0.gridStep < D0*J0 && D0 && !(await okToReveal(c0, [Math.floor(v0.gridStep/D0)]))) return;
  if ((v0.screen==='results' || (v0.screen==='grid' && v0.gridStep>=D0*J0)) && !(await okToReveal(c0, c0.judges.map((_,j)=>j)))) return;
  act((c,v) => {
    const D=live(c).length, J=c.judges.length, L=resultList(c).length;
    if (v.screen==='title' || v.screen==='blank'){ v.screen='grid'; return; }
    if (v.screen==='grid'){
      if (v.gridStep < D*J){ v.gridStep++; flash(c,'cell'); }
      else if (!v.showTotals){ v.showTotals=true; flash(c,'totals'); }
      else { v.screen='results'; }
      return;
    }
    if (v.screen==='results' && v.resStep < L){ v.resStep++; flash(c,'row'); }
  });
}
function back(){
  act((c,v) => {
    if (v.screen==='grid'){ if (v.showTotals) v.showTotals=false; else if (v.gridStep>0) v.gridStep--; }
    else if (v.screen==='results' && v.resStep>0) v.resStep--;
    v.lastReveal = null;
  });
}
function setScreen(s){ act((c,v) => { v.screen=s; v.lastReveal=null; }); }
window.feisKey = function(key){
  if (document.querySelector('.dlgOv, .full')) return false;
  if (key===' ' || key==='ArrowRight' || key==='PageDown' || key==='Enter'){ next(); return true; }
  if (key==='ArrowLeft' || key==='PageUp' || key==='Backspace'){ back(); return true; }
  const m = { t:'title', g:'grid', r:'results', h:'blank' }[key.toLowerCase()];
  if (m){ setScreen(m); return true; }
  return false;
};
function startPresent(){
  const ov = document.getElementById('presentOv'), pov = document.getElementById('pov'), info = document.getElementById('povInfo');
  ov.classList.add('on');
  if (!pov.__ready) { pov.onload = () => { pov.__ready = true; pov.contentDocument.__html = null; pushDisplay(); }; pov.srcdoc = SHELL; }
  else { pov.contentDocument.__html = null; pushDisplay(); }
  try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch(_){}
  info.innerHTML = 'Tap the right side for <b>Next</b> · left side for <b>Back</b>' + (innerHeight > innerWidth ? '<br>Turn your device sideways for the best view' : '');
  info.style.opacity = 1; clearTimeout(info.__t); info.__t = setTimeout(() => info.style.opacity = 0, 5000);
}
function stopPresent(){
  document.getElementById('presentOv').classList.remove('on');
  try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.webkitFullscreenElement) document.webkitExitFullscreen(); } catch(_){}
  if (state.tab==='show') updateShowCtl();
}
window.feisTap = x => { if (!document.getElementById('presentOv').classList.contains('on')) return; x < 0.3 ? back() : next(); };
document.getElementById('povX').onclick = stopPresent;
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && document.getElementById('presentOv').classList.contains('on')) { stopPresent(); return; }
  if (state.tab!=='show') return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.target.tagName==='BUTTON' && (e.key===' '||e.key==='Enter')) { e.preventDefault(); }
  if (window.feisKey(e.key)) e.preventDefault();
});

/* ---------------- Control UI ---------------- */
const main = document.getElementById('main');
function renderHeader(){
  const sel = document.getElementById('editSel');
  sel.innerHTML = state.comps.map(c => `<option value="${c.id}" ${c.id===state.editId?'selected':''}>${esc(c.name)}</option>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===state.tab));
}
function render(){
  renderHeader();
  ({ overview:renderOverview, registration:renderRegistration, setup:renderSetup, scores:renderScores, show:renderShow, settings:renderSettings }[state.tab] || renderOverview)();
}

document.getElementById('editSel').onchange = e => { state.editId = e.target.value; state.judgeTab=-1; save(); render(); };
document.getElementById('newComp').onclick = async () => {
  const name = await askText('New competition', 'e.g. Under 11 Open Championship'); if (!name) return;
  const c = newComp(name.trim()); const prev = editComp();
  if (prev){ c.judges = prev.judges.slice(); c.rounds = prev.rounds; c.entry = prev.entry; }
  state.comps.push(c); state.editId = c.id; state.tab='setup'; save(); render();
};
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { state.tab=b.dataset.tab; save(); render(); });
document.getElementById('openDisp').onclick = () => (dispWin && !dispWin.closed) ? dispWin.focus() : openDisplay();

function compStatus(c){
  const D=live(c).length, J=c.judges.length, v=c.view, L=resultList(c).length;
  const ent=c.judges.map((_,j)=>judgeComplete(c,j)), full=ent.filter(n=>D && n===D).length;
  const vc=c.judges.filter((_,j)=>isVerified(c,j)).length;
  if (!D) return ['Setting up','grey'];
  if (v.screen==='results' && L && v.resStep>=L) return ['Announced','done'];
  if (full===J && vc===J) return ['Ready to announce','ready'];
  if (full===J) return [`Needs read-back · ${vc}/${J} checked`,'warn'];
  if (ent.some(n=>n>0)) return [`Entering sheets · ${full}/${J} in`,'work'];
  return ['Waiting for sheets','grey'];
}
function announceBtn(c, big){
  const D = live(c).length, J = c.judges.length;
  const full = c.judges.filter((_,j) => D && judgeComplete(c,j) === D).length, vc = c.judges.filter((_,j) => isVerified(c,j)).length;
  const done = compStatus(c)[1] === 'done';
  let cls, label, tip, dis = '';
  if (!D || full < J) { cls='an-grey'; label='📣 Announce scores'; tip=`${J-full} sheet${J-full>1?'s':''} still to enter`; dis='disabled'; }
  else if (done) { cls='an-done'; label='📣 Announced ✓'; tip='Already announced — open the screen controls'; }
  else if (vc < J) { cls='an-yellow'; label='📣 Announce scores'; tip=`All sheets in · ${J-vc} still to read back`; }
  else { cls='an-green'; label='📣 Announce scores'; tip='All sheets in and verified'; }
  return `<button class="annBtn ${cls} ${big?'big2':''}" data-announce="${c.id}" title="${tip}" ${dis}>${label}${big?`<small>${tip}</small>`:''}</button>`;
}
function bindAnnounce(){
  main.querySelectorAll('[data-announce]').forEach(b => b.onclick = e => { e.stopPropagation(); state.liveId = b.dataset.announce; state.tab = 'show'; save(); render(); pushDisplay(); scrollTo(0,0); });
}
let ovDay = 'all';
function ovComps(){
  const dayOf = c => c.gen ? c.gen.day : 'other';
  const list = state.comps.filter(c => ovDay === 'all' || dayOf(c) === ovDay);
  const rank = c => c.gen ? (c.gen.day === 'Sat' ? 1 : 2) : (isDemo(c) ? 3 : 0);
  return list.map((c,i) => [c,i]).sort((a,b) => rank(a[0]) - rank(b[0]) || (a[0].gen && b[0].gen ? a[0].gen.order - b[0].gen.order || a[0].gen.from - b[0].gen.from : a[1]-b[1])).map(x => x[0]);
}
function renderOverview(){
  const counts = {};
  ovComps().forEach(c => { const k = compStatus(c)[1]; counts[k] = (counts[k]||0)+1; });
  main.innerHTML = `
  <section class="card"><h2>All competitions <span class="muted">— where each one stands. Tap a sheet number to type it in.</span></h2>
    ${photosOn() ? `<div class="hint">📷 <b>Sheets arriving in a stack?</b> Tap the camera under any sheet number — or <label class="btnlike primaryLike" style="margin:0 4px">📷 Add sheet photo<input type="file" accept="image/*" capture="environment" id="ovCam" hidden></label> and pick which sheet it is after. You stay on this page, so you can snap a whole stack in any order.</div>` : ''}
    <div class="ovCounts">${[['work','being entered'],['warn','need read-back'],['ready','ready to announce'],['done','announced'],['grey','waiting / setting up']].filter(([k])=>counts[k]).map(([k,l])=>`<span class="st ${k}">${counts[k]} ${l}</span>`).join('')}</div>
    ${state.comps.some(c => c.gen) ? `<div class="row" style="margin:0 0 8px"><select id="ovDay"><option value="all">All competitions</option><option value="Sat" ${ovDay==='Sat'?'selected':''}>Saturday</option><option value="Sun" ${ovDay==='Sun'?'selected':''}>Sunday</option><option value="other" ${ovDay==='other'?'selected':''}>Other (demo / added by hand)</option></select></div>` : ''}
    <div class="tblwrap"><table class="tbl ov"><thead><tr><th>Competition</th><th class="num hide-m">Dancers</th><th>Score sheets</th><th>Status</th><th></th></tr></thead><tbody>
    ${ovComps().map(c => { const [st,k] = compStatus(c), D=live(c).length;
      return `<tr class="ovRow" data-row="${c.id}"><td><b>${esc(c.name)}</b>${c.id===state.liveId?' <button class="pill onair" data-onair title="Go to Show on screen">ON SCREEN ▸</button>':''}<span class="nm">${D} dancers</span></td>
        <td class="num hide-m">${D}</td>
        <td><div class="chips">${c.judges.map((n,j)=>{ const e=judgeComplete(c,j), ver=isVerified(c,j);
          const cls = ver?'ver':(D&&e===D?'ent':(e>0?'part':'none'));
          const tip = ver?'verified':(D&&e===D?'entered, not read back':(e>0?`${e}/${D} entered`:'not entered'));
          return `<span class="slot"><button class="chip ${cls}" data-go="${c.id}" data-j="${j}" title="Adjudicator ${j+1}: ${esc(n)} — ${tip}">${j+1}</button>${photosOn() ? `<label class="cam" data-ph="${c.id}:${j}" title="Photo of Adjudicator ${j+1}'s sheet"><span>📷</span><input type="file" accept="image/*" capture="environment" data-cam="${c.id}:${j}" hidden></label>` : ''}</span>`; }).join('')}</div></td>
        <td><span class="st ${k}">${st}</span></td>
        <td class="num"><div class="btns"><button data-enter="${c.id}">Open</button>${announceBtn(c)}</div></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="legend muted"><span class="chip none">1</span> not in yet <span class="chip part">1</span> partly typed <span class="chip ent">1</span> typed, not read back <span class="chip ver">1</span> verified${photosOn() ? ' · <span class="cam">📷</span> no photo yet <span class="cam has">📷</span> photo on file' : ''}</div>
  </section>`;
  const od = document.getElementById('ovDay'); if (od) od.onchange = e => { ovDay = e.target.value; renderOverview(); };
  const go = (c, j) => { state.editId=c.id; state.judgeTab=j; state.tab='scores'; save(); render(); scrollTo(0,0); };
  main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(getComp(b.dataset.go), +b.dataset.j));
  main.querySelectorAll('[data-enter]').forEach(b => b.onclick = () => go(getComp(b.dataset.enter), -1));
  const toShow = () => { state.tab='show'; save(); render(); scrollTo(0,0); };
  main.querySelectorAll('[data-onair]').forEach(b => b.onclick = toShow);
  main.querySelectorAll('tr.ovRow').forEach(tr => tr.onclick = e => { if (e.target.closest('button, label, input, a')) return; go(getComp(tr.dataset.row), -1); });
  bindAnnounce();
  main.querySelectorAll('[data-live]').forEach(b => b.onclick = () => { state.liveId=b.dataset.live; state.tab='show'; save(); render(); pushDisplay(); scrollTo(0,0); });
  if (photosOn()) {
    main.querySelectorAll('[data-ph]').forEach(async el => { const [id,j]=el.dataset.ph.split(':'); const c=getComp(id); if (c && await getPhoto(c,+j)) el.classList.add('has'); });
    const oc = document.getElementById('ovCam');
    if (oc) oc.onchange = async () => { const f = oc.files[0]; if (!f) return;
      const c0 = state.comps.find(c => compStatus(c)[1] !== 'done' && live(c).length) || state.comps[0];
      try { const to = await savePhoto(c0, 0, f); if (to) { const tl = main.querySelector(`[data-ph="${to.c.id}:${to.j}"]`); if (tl) { tl.classList.add('has','flash'); setTimeout(()=>tl.classList.remove('flash'), 900); } toast(`📷 Saved: ${shortName(to.c)} · Adjudicator ${to.j+1}`); } }
      catch(_) { toast('Could not save the photo on this device.'); }
      oc.value = ''; };
    main.querySelectorAll('[data-cam]').forEach(inp => inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return; const [id,j] = inp.dataset.cam.split(':'); const c = getComp(id);
      const lab = inp.closest('.cam'); lab.classList.add('busy');
      try { const to = await savePhoto(c, +j, f); if (to) { const tl = main.querySelector(`[data-ph="${to.c.id}:${to.j}"]`) || lab; tl.classList.add('has','flash'); setTimeout(()=>tl.classList.remove('flash'), 900);
        toast(`📷 Saved: ${shortName(to.c)} · Adjudicator ${to.j+1}`); } }
      catch(_) { toast('Could not save the photo on this device.'); }
      lab.classList.remove('busy'); inp.value = '';
    });
  }
}
function renderSetup(){

function refreshScoreCalc(){

  const vs = document.getElementById('verState'), vv = c.verified?.[j];
  if (isVerified(c,j)) { vs.className='vstate ok'; vs.textContent = `Verified ✓${vv.by ? ' by '+vv.by : ''} at ${new Date(vv.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`; }

function shrinkImage(file, cb){

const LEVELS = [['ba','Beginner A'],['bb','Beginner B'],['int','Intermediate']];
const SOLOS = [['lj','Light Jig'],['sj','Slip Jig'],['sgj','Single Jig'],['tj','Treble Jig'],['hp','Hornpipe']];

  });

function eventKeyOf(raw){
  const s = raw.toLowerCase().replace(/[’']/g,"'");
  if (/open champion championship/.test(s)) return 'oc';
  if (/open champion premiere/.test(s)) return 'ocp';
  if (/prelim/.test(s)) return 'pc';
  if (/tir na nog|tír na nóg/.test(s)) return 'tnn';
  const lv = /beginner a/.test(s) ? 'ba' : /beginner b/.test(s) ? 'bb' : /intermediate/.test(s) ? 'int' : null;
  if (!lv) return null;
  if (/award/.test(s)) return `${lv}-award`;
  if (/premiere/.test(s)) return lv === 'ba' ? null : `${lv}-prem`;
  for (const [sk,sn] of SOLOS) if (s.includes(sn.toLowerCase())) return `${lv}-${sk}`;
  return null;
}
const splitList = s => String(s||'').split(/,\s*(?![^()]*\))/).map(x => x.trim()).filter(Boolean);

function setKey(s){ return String(s).toLowerCase().replace(/[’']/g,'').replace(/&/g,'and').replace(/\b(the|of|speed|long version|modern set|ms)\b/g,' ').replace(/[^a-z]/g,''); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function matchModern(raw){
  if (!raw) return null;
  const txt = String(raw), nums = txt.match(/\d{2,3}/g), speed = nums ? nums[nums.length-1] : '';
  const k = setKey(txt.replace(/\d+/g,''));
  if (!k) return { raw:txt, name:'', type:'', speed, ok:false };
  let best = null;
  for (const [a,v] of Object.entries(SET_ALIASES)) if (k === a || k.startsWith(a)) best = { name:v, score:1 };
  if (!best) {
    const all = [...HP_SETS, ...TJ_SETS].map(n => { const nk = setKey(n); return { name:n, score: 1 - lev(k, nk)/Math.max(k.length, nk.length) }; });
    all.sort((a,b) => b.score - a.score); best = all[0];
  }
  const ok = best.score >= 0.72;
  if (!ok) {   // no set name, but they told us which kind ("hornpipe modern set, treble jig, reel")
    const t = /hornpipe modern|modern hornpipe|^\s*hornpipe/i.test(txt) ? 'HP' : /(treble )?jig modern|modern (treble )?jig/i.test(txt) ? 'TJ' : '';
    return { raw:txt, name:'', type:t, speed, ok:false };
  }
  return { raw:txt, name: best.name, type: HP_SETS.includes(best.name) ? 'HP' : 'TJ', speed, ok };
}
// Heavy / light rounds from the modern set (boys always dance reel)
function premLight(d){ return d.boy ? 'Reel' : 'Slip Jig'; }
function roundsFor(d){
  const t = d.modern && d.modern.type;
  if (!t) return { heavy:'?', light: d.boy ? 'Reel' : '?' };
  const heavy = t === 'HP' ? 'Treble Jig' : 'Hornpipe';
  const light = d.boy ? 'Reel' : (heavy === 'Treble Jig' ? 'Reel' : 'Slip Jig');
  return { heavy, light };
}

function schoolKey(s){ return String(s||'').toLowerCase().replace(/[’'`]/g,'').replace(/&/g,' and ').replace(/\b(school|of|irish|dance|dancing|the)\b/g,' ').replace(/[^a-z0-9]/g,''); }
function toISODate(v){
  if (!v) return '';
  if (v instanceof Date && !isNaN(v)) { const p = n => String(n).padStart(2,'0'); return `${v.getFullYear()}-${p(v.getMonth()+1)}-${p(v.getDate())}`; }
  const s = String(v).trim(); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  const m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m2) { const y = m2[3].length===2 ? '20'+m2[3] : m2[3]; return `${y}-${m2[1].padStart(2,'0')}-${m2[2].padStart(2,'0')}`; }
  return s;
}
function ageOn(dob, on){ if (!/^\d{4}-\d{2}-\d{2}$/.test(dob)) return null; const [y,m,d] = dob.split('-').map(Number), [Y,M,D] = on.split('-').map(Number); return Y - y - ((M < m || (M === m && D < d)) ? 1 : 0); }

/* ---------- parse one workbook ---------- */
function parseRegSheet(rows, fileLabel){
  const hdr = (rows[0] || []).map(h => String(h || ''));
  const splitAt = hdr.findIndex(h => h.startsWith('Do you have another dancer'));
  const subCol = hdr.findIndex(h => h === 'Submitted At');
  const ranges = splitAt >= 0 ? [[0, splitAt], [splitAt+1, hdr.length]] : [[0, hdr.length]];
  const blocks = ranges.map(([lo,hi]) => { const b = {}; for (let i=lo;i<hi;i++){ const h = hdr[i];
      if (h.startsWith('Waiver')) break;
      if (/full name/i.test(h)) b.name = i; else if (/^What is the birthdate/i.test(h)) b.dob = i; else if (/^How old/i.test(h)) b.age = i;
      else if (/dance school/i.test(h)) b.school = i; else if (h === 'Event' || /^Please select the Award/i.test(h)) b.events = i;
      else if (/^Thank you for registering/i.test(h)) b.modern = i; else if (/^Please select all the solo/i.test(h)) b.solos = i; }
    return b; });
  if (!blocks[0] || blocks[0].name == null) return { error:`${fileLabel}: this doesn’t look like a registration export (no dancer name column).` };
  const out = [];
  rows.slice(1).forEach((r, ri) => {
    if (!r || !r.some(v => v !== null && v !== '' && v !== undefined)) return;
    blocks.forEach((b, bi) => {
      const g = k => b[k] != null ? r[b[k]] : null;
      const name = String(g('name') || '').trim(); if (!name) return;
      const dob = toISODate(g('dob'));
      const age = Number(g('age')) || ageOn(dob, EVENT_DATE) || null;
      const entries = [...splitList(g('events')), ...splitList(g('solos'))];
      const sub = subCol >= 0 ? r[subCol] : null;
      out.push({ name: name.replace(/\s+/g,' '), dob, age, schoolRaw: String(g('school') || '').trim(), entries, modernRaw: g('modern') ? String(g('modern')).trim() : '',
                 sub: sub instanceof Date ? sub.toISOString() : String(sub || ''), src: `${fileLabel} row ${ri+2}${bi ? ' (2nd dancer)' : ''}` });
    });
  });
  return { dancers: out };
}

/* ---------- build the registration model ---------- */
function buildReg(raws, prev){
  // merge duplicate registrations (same name + birth date)
  const byKey = new Map();
  raws.sort((a,b) => (a.sub || '').localeCompare(b.sub || ''));
  raws.forEach(x => {
    const k = x.name.toLowerCase() + '|' + x.dob;
    const ex = byKey.get(k);
    if (!ex) byKey.set(k, { ...x, srcs:[x.src], dupes:0 });
    else { ex.entries = [...new Set([...ex.entries, ...x.entries])]; if (x.modernRaw) ex.modernRaw = x.modernRaw; ex.srcs.push(x.src); ex.dupes++; if (!ex.schoolRaw) ex.schoolRaw = x.schoolRaw; }
  });
  const keep = prev ? new Map(prev.dancers.map(d => [d.key, d])) : new Map();
  let n = prev ? prev.startNo : REG_START_NO;
  const dancers = [...byKey.entries()].map(([key, x], i) => {
    const old = keep.get(key);
    const events = [], unknown = [];
    x.entries.forEach(e => { const k = eventKeyOf(e); if (k) { if (!events.includes(k)) events.push(k); } else unknown.push(e); });
    return { id: old ? old.id : uid(), key, no: old ? old.no : null, name: x.name, dob: x.dob, age: x.age, schoolRaw: x.schoolRaw,
             events, unknown, modern: old && old.modernEdited ? old.modern : matchModern(x.modernRaw), modernEdited: !!(old && old.modernEdited),
             boy: old ? !!old.boy : false, srcs: x.srcs, dupes: x.dupes, sub: x.sub };
  });
  // numbers in registration order (keep numbers already given)
  const used = new Set(dancers.filter(d => d.no).map(d => d.no));
  dancers.forEach(d => { if (!d.no) { while (used.has(n)) n++; d.no = n; used.add(n); } });
  // school name merges: group by key, canonical = most common spelling
  const groups = {};
  dancers.forEach(d => { const k = schoolKey(d.schoolRaw) || '(none)'; (groups[k] = groups[k] || {}); groups[k][d.schoolRaw] = (groups[k][d.schoolRaw] || 0) + 1; });
  const schoolNames = { ...(prev && prev.schoolNames || {}) };
  Object.entries(groups).forEach(([k, v]) => { if (!schoolNames[k]) schoolNames[k] = Object.entries(v).sort((a,b) => b[1]-a[1] || b[0].length-a[0].length)[0][0] || '(no school)'; });
  const reg = { dancers, schoolNames, schoolGroups: groups, startNo: prev ? prev.startNo : REG_START_NO, bands: prev ? prev.bands || {} : {}, judges: prev ? prev.judges : ['Adjudicator 1','Adjudicator 2','Adjudicator 3'], importedAt: Date.now() };
  REG_EVENTS.forEach(e => { if (!reg.bands[e.key]) reg.bands[e.key] = autoBands(regAges(reg, e.key)); });
  return reg;
}
const schoolOf = (reg, d) => reg.schoolNames[schoolKey(d.schoolRaw) || '(none)'] || d.schoolRaw || '(no school)';
const regDancersIn = (reg, key) => reg.dancers.filter(d => d.events.includes(key));
const dayDate = day => day === 'Sun' ? '2026-11-22' : '2026-11-21';
// CRDM: age category = the dancer's age on the day of the Feis
const ageFor = (d, key) => { const a = ageOn(d.dob, dayDate((regEvent(key) || {}).day)); return a != null && a >= 2 && a < 100 ? a : (d.age || 0); };
function regAges(reg, key){ const c = {}; regDancersIn(reg, key).forEach(d => { const a = ageFor(d, key); c[a] = (c[a] || 0) + 1; }); return Object.entries(c).map(([a,n]) => [+a, n]).sort((x,y) => x[0]-y[0]); }

/* ---------- age groups: as many groups of 6+ as possible, evenly sized ---------- */
function autoBands(ages, min = 6){
  const k = ages.length; if (!k) return [];
  const pre = [0]; ages.forEach(([,n]) => pre.push(pre[pre.length-1] + n));
  const total = pre[k];
  if (total < 2*min) return [ages[0][0]];
  // best[i] = best partition of first i distinct ages: [groups, -sumsq, starts]
  const best = Array(k+1).fill(null); best[0] = [0, 0, []];
  for (let i=1;i<=k;i++) for (let j=0;j<i;j++) {
    const sz = pre[i]-pre[j]; if (sz < min || !best[j]) continue;
    const cand = [best[j][0]+1, best[j][1]-sz*sz, [...best[j][2], ages[j][0]]];
    if (!best[i] || cand[0] > best[i][0] || (cand[0] === best[i][0] && cand[1] > best[i][1])) best[i] = cand;
  }
  return best[k] ? best[k][2] : [ages[0][0]];
}
function bandsOf(reg, key){
  const ages = regAges(reg, key), starts = (reg.bands[key] || []).filter(a => ages.some(([x]) => x >= a)).sort((a,b) => a-b);
  if (!ages.length) return [];
  if (!starts.length || starts[0] > ages[0][0]) starts.unshift(ages[0][0]);
  return starts.map((s, i) => { const hi = starts[i+1]; const in_ = ages.filter(([a]) => a >= s && (hi == null || a < hi));
    return { from: in_.length ? in_[0][0] : s, to: in_.length ? in_[in_.length-1][0] : s, n: in_.reduce((t,[,n]) => t+n, 0), first: i === 0, last: i === starts.length-1 }; }).filter(b => b.n);
}
function bandLabel(b, only){
  if (only) return 'All ages';
  if (b.from === b.to) return `Age ${b.from}`;
  if (b.last && b.to - b.from > 2) return `Ages ${b.from} & over`;
  if (b.first && b.to - b.from > 2) return `Ages ${b.to} & under`;
  return `Ages ${b.from}–${b.to}`;
}

/* ---------- line-ups ---------- */
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
// order so no two neighbours share a school (as far as possible)
function separateSchools(list, schoolFn, prevSchool){
  const left = shuffle(list), out = []; let last = prevSchool;
  while (left.length) {
    const counts = {}; left.forEach(d => counts[schoolFn(d)] = (counts[schoolFn(d)] || 0) + 1);
    const ok = left.filter(d => schoolFn(d) !== last);
    const pool = ok.length ? ok : left;
    const top = Math.max(...pool.map(d => counts[schoolFn(d)]));
    const pick = pool.find(d => counts[schoolFn(d)] === top);
    left.splice(left.indexOf(pick), 1); out.push(pick); last = schoolFn(pick);
  }
  return out;
}
function makeLineup(reg, key, dancers){
  const sf = d => schoolOf(reg, d);
  let best = null;
  for (let t=0; t<40; t++) {
    let order;
    if (key === 'oc') {
      const hp = dancers.filter(d => d.modern && d.modern.type === 'HP'), tj = dancers.filter(d => d.modern && d.modern.type === 'TJ'), un = dancers.filter(d => !(d.modern && d.modern.type));
      const a = separateSchools(hp, sf), b = separateSchools(tj, sf, a.length ? sf(a[a.length-1]) : null), c = separateSchools(un, sf, (b.length ? sf(b[b.length-1]) : a.length ? sf(a[a.length-1]) : null));
      order = [...a, ...b, ...c];
    } else order = separateSchools(dancers, sf);
    const clashes = order.reduce((n, d, i) => n + (i && sf(order[i-1]) === sf(d) ? 1 : 0), 0);
    if (!best || clashes < best.clashes) best = { order, clashes };
    if (!clashes) break;
  }
  return best;
}

/* ---------- create competitions ---------- */
function generateComps(reg){
  const made = [];
  REG_EVENTS.forEach(e => {
    const bands = bandsOf(reg, e.key);
    bands.forEach(b => {
      const ds = regDancersIn(reg, e.key).filter(d => ageFor(d, e.key) >= b.from && ageFor(d, e.key) <= b.to);
      if (!ds.length) return;
      const lu = makeLineup(reg, e.key, ds);
      const c = newComp(`${e.label} · ${bandLabel(b, bands.length === 1)}`);
      c.gen = { key: e.key, from: b.from, to: b.to, day: e.day, order: e.order, clashes: lu.clashes };
      c.judges = e.judges === 3 ? reg.judges.slice(0,3) : [reg.judges[0] || 'Adjudicator 1'];
      c.rounds = e.rounds.length; c.roundNames = e.rounds.slice(); c.places = -1;
      c.dancers = lu.order.map(d => ({ id: uid(), rid: d.id, no: String(d.no), name: d.name, school: schoolOf(reg, d) }));
      made.push(c);
    });
  });
  return made;
}
function redrawComp(c){
  const reg = state.reg; if (!reg || !c.gen) return;
  const byRid = new Map(reg.dancers.map(d => [d.id, d]));
  const ds = c.dancers.map(x => byRid.get(x.rid)).filter(Boolean);
  const lu = makeLineup(reg, c.gen.key, ds);
  const old = new Map(c.dancers.map(x => [x.rid, x]));
  c.dancers = lu.order.map(d => old.get(d.id)); c.gen.clashes = lu.clashes;
}

    return `<section class="pg"><div class="hd">${logo ? `<img class="lg" src="${logo}">` : ''}<div><div class="ev">${esc(ev)}</div><h1>${esc(c.name)}</h1>
      <div class="meta">${c.gen ? (c.gen.day === 'Sat' ? 'Saturday, November 21' : 'Sunday, November 22') + ' · ' : ''}${ds.length} dancers · dancing 2 at a time</div></div></div>

  });
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Line-ups</title><style>
    @page { size: letter; margin: 0.5in; } body { margin:0; font-family: Arial, sans-serif; color:#111; }
    .bar { padding:10px; background:#f4f6f9; border-bottom:1px solid #ddd; font-size:14px; } .bar button { font-size:15px; padding:6px 14px; margin-right:10px; } @media print { .bar { display:none; } }
    @media screen { body { background:#e9ecef; } .pg { width:7.5in; margin:16px auto; padding:0.4in; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.15); } }
    .pg { page-break-after: always; break-after: page; } .hd { display:flex; gap:12px; align-items:center; margin-bottom:12px; } .lg { width:.7in; height:.7in; border-radius:50%; }
    .ev { font-size:9pt; text-transform:uppercase; letter-spacing:.08em; color:#555; } h1 { font-size:17pt; margin:2px 0; } .meta { font-size:10pt; color:#444; }
    table { border-collapse:collapse; width:100%; font-size:10pt; } th { background:#ece8f3; text-align:left; padding:5px 6px; border:1px solid #999; } td { border:1px solid #bbb; padding:5px 6px; }
    tr.np td { border-top:2px solid #444; } td.pr { text-align:center; font-weight:bold; background:#f7f5fb; } td.no { font-weight:bold; } .sp { color:#555; } .miss { color:#b42318; } .b { color:#555; font-size:8.5pt; }
    thead { display:table-header-group; } tr { break-inside:avoid; }
  </style></head><body><div class="bar"><button onclick="print()">Print</button>${comps.length} line-up${comps.length>1?'s':''}. Pairs dance together; the last dancer goes alone when the number is odd.</div>${pages.join('')}</body></html>`;
  const w = window.open('', '_blank');
  if (!w) return toast('Line-ups can’t open here — print them from your website or the laptop file.');
  w.document.open(); w.document.write(html); w.document.close();
}

/* ---------- Excel reading ---------- */
async function readRegFiles(files){
  if (typeof XLSX === 'undefined') { toast('Excel reader not available in this edition.'); return null; }
  const raws = [], errors = [];
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type:'array', cellDates:true });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:null });
      const label = f.name.replace(/\.(xlsx|xls|csv)$/i,'').replace(/^[0-9a-f]{8}-/,'').replace(/_/g,' ');
      const res = parseRegSheet(rows, label);
      if (res.error) errors.push(res.error); else raws.push(...res.dancers);
    } catch (e) { errors.push(`${f.name}: couldn’t read this file.`); }
  }
  return { raws, errors };
}

function ruleFlags(reg){
  const out = [];
  reg.dancers.forEach(d => {

    const lv = { ba:'Beginner A', bb:'Beginner B' };
    if (d.events.includes('ba-award')) { const n = d.events.filter(k => /^ba-(lj|sj|sgj|tj|hp)$/.test(k)).length; if (n < 3) out.push({ d, msg:`Beginner A Award needs 3+ A-grade solo dances — entered ${n} here (check prior feiseanna)` }); }
    if (d.events.includes('bb-award')) { const n = d.events.filter(k => /^bb-(lj|sj|sgj|tj|hp)$/.test(k)).length; if (n < 2) out.push({ d, msg:`Beginner B Award needs 2+ B-grade solo dances — entered ${n} here (check prior feiseanna)` }); }
    if (d.boy) { const ch = d.events.filter(k => ['oc','pc','ocp','bb-prem','int-prem'].includes(k)); if (ch.length > 1) out.push({ d, msg:`Boys may take part in only one Championship — entered ${ch.map(k => regEvent(k).label).join(' + ')}` }); }
  });
  return out;
}

    dupes: reg.dancers.filter(d => d.dupes),
    merges: Object.entries(reg.schoolGroups).filter(([k, v]) => Object.keys(v).length > 1),
    rules: ruleFlags(reg),
  };

  <section class="card"><div class="stepHead"><span class="step">${iss.merges.length?5:4}</span><h2 style="margin:0">Competitions & line-ups</h2></div>
    <div class="row"><label>Adjudicator 1 <input data-adj="0" value="${esc(reg.judges[0]||'')}"></label><label>Adjudicator 2 <input data-adj="1" value="${esc(reg.judges[1]||'')}"></label><label>Adjudicator 3 <input data-adj="2" value="${esc(reg.judges[2]||'')}"></label>
      <span class="muted" style="padding-bottom:6px">Per CRDM rules: Open, Preliminary and Premiere Prize competitions use all three; Awards and solos use one (Adjudicator 1). Change any competition on its Setup tab.</span></div>
    <div class="row"><button id="genComps" class="primary">${comps.length ? '↻ Rebuild competitions & line-ups' : '✓ Create competitions & line-ups'}</button>
      ${comps.length ? `<button id="prSat">🖨 Saturday line-ups</button><button id="prSun">🖨 Sunday line-ups</button><button id="prSheets">🖨 Score sheets — all</button>` : ''}</div>
    ${comps.length ? genSummaryHTML(comps) : '<div class="muted">This creates one competition per event and age group, with the dancers in line-up order: hornpipe modern sets first, then treble jig, and no two dancers from the same school back to back.</div>'}
  </section>`;
  const $ = id => document.getElementById(id);
  $('regFiles').onchange = e => importReg([...e.target.files]);
  $('regClear').onclick = async () => { if (!(await askConfirm('Clear all registrations?', 'Dancers, numbers and age groups will be removed from this device. Competitions already created stay.', 'Clear'))) return; delete state.reg; save(); render(); };
  main.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { regView.filter = b.dataset.filter; render(); setTimeout(() => document.getElementById('regQ').scrollIntoView({ block:'center' }), 30); });
  $('regQ').oninput = e => { regView.q = e.target.value; drawRegRows(); };
  $('regF').onchange = e => { regView.filter = e.target.value; drawRegRows(); };
  main.querySelectorAll('[data-school]').forEach(inp => inp.onchange = () => { reg.schoolNames[inp.dataset.school] = inp.value.trim() || inp.value; save(); });
  main.querySelectorAll('[data-adj]').forEach(inp => inp.oninput = () => { reg.judges[+inp.dataset.adj] = inp.value; save(); });
  $('bandsAuto').onclick = () => { REG_EVENTS.forEach(e => reg.bands[e.key] = autoBands(regAges(reg, e.key))); save(); render(); toast('Age groups re-split automatically.'); };
  bindBands(reg);
  $('genComps').onclick = async () => {
    const old = state.comps.filter(c => c.gen), scored = old.filter(c => Object.keys(c.scores||{}).length);
    if (old.length && !(await askConfirm('Rebuild competitions?', `This replaces the ${old.length} competitions made from registrations${scored.length ? ` — ${scored.length} of them already have scores, which will be lost` : ''}. Your other competitions stay.`, 'Rebuild'))) return;
    const made = generateComps(reg);
    state.comps = state.comps.filter(c => !c.gen).concat(made);
    if (!getComp(state.liveId)) state.liveId = made[0] && made[0].id;
    save(); render(); toast(`${made.length} competitions created.`);
  };
  if ($('prSat')) { $('prSat').onclick = () => printLineups(sortedGen().filter(c => c.gen.day === 'Sat')); $('prSun').onclick = () => printLineups(sortedGen().filter(c => c.gen.day === 'Sun')); $('prSheets').onclick = () => printSheets(sortedGen()); }
  main.querySelectorAll('[data-redraw]').forEach(b => b.onclick = () => { const c = getComp(b.dataset.redraw); redrawComp(c); save(); render(); toast('New line-up drawn.'); });
  main.querySelectorAll('[data-lu]').forEach(b => b.onclick = () => printLineups([getComp(b.dataset.lu)]));
  drawRegRows();
}
const sortedGen = () => state.comps.filter(c => c.gen).sort((a,b) => (a.gen.day === b.gen.day ? 0 : a.gen.day === 'Sat' ? -1 : 1) || a.gen.order - b.gen.order || a.gen.from - b.gen.from);
function genSummaryHTML(comps){
  const byDay = d => sortedGen().filter(c => c.gen.day === d);
  const row = c => { const n = live(c).length; return `<tr><td>${esc(c.name)}</td><td class="num">${n}${n < 6 ? ' <span class="pill tie">under 6</span>' : ''}</td><td class="num">${c.judges.length}</td>
    <td>${c.gen.clashes ? `<span class="warn">${c.gen.clashes} same-school pair${c.gen.clashes>1?'s':''} unavoidable</span>` : '<span class="muted">✓ schools apart</span>'}</td>
    <td class="num"><button class="mini" data-lu="${c.id}">Line-up</button> <button class="mini" data-redraw="${c.id}">↻ Re-draw</button></td></tr>`; };
  return ['Sat','Sun'].map(d => { const cs = byDay(d); if (!cs.length) return '';
    return `<h3 class="dayH">${d === 'Sat' ? 'Saturday, November 21' : 'Sunday, November 22'} <span class="muted">— ${cs.length} competitions</span></h3>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Competition</th><th class="num">Dancers</th><th class="num">Adj.</th><th>Line-up</th><th></th></tr></thead><tbody>${cs.map(row).join('')}</tbody></table></div>`; }).join('');
}
function bandRowHTML(reg, e, n){
  const ages = regAges(reg, e.key), starts = new Set(bandsOf(reg, e.key).map(b => b.from)), bands = bandsOf(reg, e.key);
  return `<div class="bandRow"><div class="bandHead"><b>${esc(e.label)}</b> <span class="muted">${e.day === 'Sat' ? 'Sat' : 'Sun'} · ${n} dancers</span></div>
    <div class="ages">${ages.map(([a,c], i) => `${i ? `<button class="gap ${starts.has(a) ? 'cut' : ''}" data-cut="${e.key}:${a}" title="${starts.has(a) ? 'Join these ages' : 'Split here'}">${starts.has(a) ? '│' : '·'}</button>` : ''}<span class="age"><b>${a}</b><small>${c}</small></span>`).join('')}</div>
    <div class="bands">${bands.map(b => `<span class="band ${b.n < 6 ? 'small' : ''}">${bandLabel(b, bands.length === 1)}: <b>${b.n}</b></span>`).join('')}</div></div>`;
}
function bindBands(reg){
  main.querySelectorAll('[data-cut]').forEach(b => b.onclick = () => {
    const [k, a] = b.dataset.cut.split(':'); const set = new Set(bandsOf(reg, k).map(x => x.from)); const age = +a;
    set.has(age) ? set.delete(age) : set.add(age); reg.bands[k] = [...set].sort((x,y) => x-y); save();
    const n = regDancersIn(reg, k).length, row = b.closest('.bandRow'); const tmp = document.createElement('div'); tmp.innerHTML = bandRowHTML(reg, regEvent(k), n); row.replaceWith(tmp.firstElementChild); bindBands(reg);
  });
}
function drawRegRows(){
  const reg = state.reg, body = document.getElementById('regBody'); if (!body) return;
  const q = regView.q.trim().toLowerCase();
  const list = reg.dancers.filter(d => {
    if (regView.filter === 'oc' && !d.events.includes('oc')) return false;
    if (regView.filter === 'modern' && !(d.events.includes('oc') && !(d.modern && d.modern.name))) return false;
    if (regView.filter === 'boys' && !d.boy) return false;
    if (regView.filter === 'unknown' && !d.unknown.length) return false;
    return !q || `${d.no} ${d.name} ${schoolOf(reg,d)}`.toLowerCase().includes(q);
  });
  const setOpts = cur => `<option value="">— choose —</option><optgroup label="Hornpipe">${HP_SETS.map(n => `<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}</optgroup><optgroup label="Treble Jig">${TJ_SETS.map(n => `<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}</optgroup>`;
  body.innerHTML = list.map(d => { const oc = d.events.includes('oc'), m = d.modern || {}, rr = roundsFor(d);
    return `<tr data-rid="${d.id}"><td><b>${d.no}</b></td><td>${esc(d.name)}<span class="nm">${esc(schoolOf(reg,d))}</span></td><td class="num">${d.events.length ? ageFor(d, d.events[0]) : (d.age ?? '')}</td><td class="hide-m">${esc(schoolOf(reg,d))}</td>
      <td class="evs">${d.events.map(k => `<span class="evc">${esc(regEvent(k).label)}</span>`).join('')}${d.unknown.map(u => `<span class="evc bad" title="Not recognized">${esc(u)}</span>`).join('')}</td>
      <td>${oc ? `<div class="mset ${m.name ? '' : 'need'}"><select data-mset="${d.id}">${setOpts(m.name)}</select><input data-mspeed="${d.id}" value="${esc(m.speed||'')}" placeholder="speed" inputmode="numeric">
        ${m.raw && !m.ok ? `<small class="warn">They wrote: “${esc(m.raw)}”</small>` : ''}${m.type ? `<small class="muted">${m.type === 'HP' ? 'Hornpipe set' : 'Treble jig set'} → heavy: ${rr.heavy}, light: ${rr.light}</small>` : ''}</div>` : '<span class="muted">—</span>'}</td>
      <td><input type="checkbox" data-boy="${d.id}" ${d.boy?'checked':''}></td></tr>`; }).join('') || `<tr><td colspan="7" class="muted">No dancers match.</td></tr>`;
  const find = id => reg.dancers.find(x => x.id === id);
  body.querySelectorAll('[data-mset]').forEach(s => s.onchange = () => { const d = find(s.dataset.mset); const n = s.value;
    d.modern = { ...(d.modern || {}), name:n, type: n ? (HP_SETS.includes(n) ? 'HP' : 'TJ') : '', ok: !!n }; d.modernEdited = true; save(); drawRegRows(); });
  body.querySelectorAll('[data-mspeed]').forEach(s => s.onchange = () => { const d = find(s.dataset.mspeed); d.modern = { ...(d.modern || {}), speed: s.value.trim() }; d.modernEdited = true; save(); });
  body.querySelectorAll('[data-boy]').forEach(cb => cb.onchange = () => { find(cb.dataset.boy).boy = cb.checked; save(); drawRegRows(); });
}
async function importReg(files){
  if (!files.length) return;
  const res = await readRegFiles(files); if (!res) return;
  if (res.errors.length) toast(res.errors.join(' '));
  if (!res.raws.length) return;
  if (state.reg && !(await dialog({ title:'Re-import registrations?', text:'Dancer numbers, boys, modern-set fixes and age groups you already set are kept for dancers who are still registered. New dancers get the next numbers.', ok:'Re-import' }))) return;
  state.reg = buildReg(res.raws, state.reg);
  save(); render();
  toast(`${state.reg.dancers.length} dancers loaded from ${files.length} file${files.length>1?'s':''}.`);
}

// migrate / sanity
if (NO_PHOTOS) { document.getElementById('ver').textContent += ' · no-photo edition'; document.title = 'Feis Live Results (no photos)'; }
if (state.demoV !== 2) {   // swap the old single demo for the multi-competition demo
  const old = state.comps.filter(c => c.demo || c.demoKey || /^Demo — /.test(c.name));
  state.comps = state.comps.filter(c => !old.includes(c));
  const ds = demoComps(); state.comps = ds.concat(state.comps);
  if (!getComp(state.editId)) state.editId = ds[2].id;
  if (!getComp(state.liveId)) state.liveId = ds[1].id;
  state.demoV = 2; state.tab = 'overview';
}
state.comps.forEach(finishDemo);
state.comps.forEach(c => { c.view = Object.assign(newView(), c.view||{}); c.scores = c.scores||{}; });
if (!state.comps.length) state.comps.push(newComp('New competition'));
if (!getComp(state.editId)) state.editId = state.comps[0].id;
if (!getComp(state.liveId)) state.liveId = state.comps[0].id;
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
