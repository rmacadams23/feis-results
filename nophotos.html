<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3a1f63">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Feis Results">
  <title>Feis Live Results — Tabulation</title>
<style>
  :root { --ink:#1d2733; --muted:#6b7785; --line:#dde3ea; --bg:#f4f6f9; --pri:#146c43; --pri2:#0f5132; --warn:#b54708; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Calibri,system-ui,sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header.bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
  .brand { font-weight:700; font-size:17px; color:var(--pri2); margin-right:8px; }
  nav#tabs { display:flex; gap:4px; margin-left:8px; }
  nav#tabs button { border:1px solid transparent; background:none; padding:7px 12px; border-radius:6px; font-weight:600; color:var(--muted); }
  .tabSep { width:1px; background:var(--line); margin:4px 6px; flex:none; }
  nav#tabs button.on { background:#e8f3ee; color:var(--pri2); border-color:#cfe5da; }
  .spacer { flex:1; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 12px; }
  button:hover { border-color:#b8c2cc; }
  button.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
  button.primary:hover { background:var(--pri2); }
  button.danger { color:var(--bad); border-color:#f1c4bf; }
  button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  input, select, textarea { font:inherit; border:1px solid #c9d1da; border-radius:5px; padding:5px 7px; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:2px solid #9fd3b9; border-color:var(--pri); }
  input.bad { border-color:var(--bad); background:#fff3f2; }
  main { padding:16px; max-width:1400px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:16px; }
  .muted { color:var(--muted); font-weight:400; font-size:13px; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin-bottom:12px; }
  .row label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .tbl { border-collapse:collapse; width:100%; margin:6px 0 10px; }
  .tbl th { text-align:left; font-size:12px; color:var(--muted); padding:6px 6px; border-bottom:1px solid var(--line); background:#fafbfc; }
  .tbl td { padding:3px 6px; border-bottom:1px solid #eef1f4; }
  .tbl td.num, .tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tbl input { width:100%; }
  .w-s { max-width:90px; }
  .w-n { max-width:90px; text-align:right; }
  .judgeTabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .judgeTabs button small { display:block; font-size:11px; opacity:.8; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; }
  .pill.ok { background:#e3f4ea; color:var(--pri2); }
  .pill.tie { background:#fff4e5; color:var(--warn); }
  .warn { color:var(--warn); }
  .bad-t { color:var(--bad); }
  .hint { background:#f0f7ff; border:1px solid #cfe2fb; border-radius:8px; padding:10px 12px; color:#244b78; font-size:13px; margin-bottom:12px; }
  .showgrid { display:grid; grid-template-columns: 360px 1fr; gap:20px; align-items:start; }
  .screens { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
  .screens button { padding:10px; font-weight:600; }
  button.big { width:100%; padding:16px; font-size:18px; font-weight:700; margin-bottom:8px; }
  button.big small { display:block; font-size:12px; font-weight:400; opacity:.85; }
  .ctl { border-top:1px solid var(--line); margin-top:12px; padding-top:12px; display:flex; flex-direction:column; gap:8px; }
  .ctl .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .ctl.keys { display:block; }
  .ctl .pill { align-self:flex-start; }
  header.bar { row-gap:6px; }
  .progress { font-size:13px; color:var(--muted); }
  #pvBox { position:relative; width:100%; background:#000; border-radius:8px; overflow:hidden; }
  #pv { border:0; width:1280px; height:720px; transform-origin:0 0; position:absolute; left:0; top:0; }
  .pvlabel { font-size:12px; color:var(--muted); font-weight:600; margin-bottom:6px; }
  .status { font-size:12px; padding:3px 8px; border-radius:10px; }
  .status.on { background:#e3f4ea; color:var(--pri2); }
  .status.off { background:#fdecea; color:var(--bad); }
  .keys { font-size:12px; color:var(--muted); line-height:1.6; }
  kbd { background:#f1f3f5; border:1px solid #d5dbe1; border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:11px; }
  .logoPrev { width:90px; height:90px; border:1px dashed #c9d1da; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#fafbfc; color:var(--muted); font-size:11px; }
  .logoPrev img { max-width:100%; max-height:100%; }
  @media (max-width: 1000px) { .showgrid { grid-template-columns:1fr; } }
  .dlgOv { position:fixed; inset:0; background:rgba(20,28,38,.45); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
  .dlg { background:#fff; border-radius:12px; padding:18px 20px; width:min(440px,100%); box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .dlg h3 { margin:0 0 8px; font-size:17px; }
  .dlg p { margin:0 0 12px; color:var(--muted); }
  .dlg .dlgIn { width:100%; margin-bottom:12px; font-size:16px; }
  .dlgBtns { display:flex; justify-content:flex-end; gap:8px; }
  button.dangerFill { background:var(--bad); color:#fff; border-color:var(--bad); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:#1d2733; color:#fff; padding:10px 16px; border-radius:10px; z-index:120; opacity:0; pointer-events:none; transition:all .25s; max-width:90%; text-align:center; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  .sheetBar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:4px 0 12px; padding:10px; background:#fafbfc; border:1px solid var(--line); border-radius:8px; }
  .photoSlot { width:64px; height:64px; border-radius:6px; border:1px dashed #c9d1da; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); overflow:hidden; background:#fff; text-align:center; cursor:pointer; flex:none; }
  .photoSlot img { width:100%; height:100%; object-fit:cover; }
  label.btnlike { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 12px; font-size:14px; color:var(--ink); font-weight:400; }
  .vstate { font-size:13px; font-weight:600; }
  .vstate.ok { color:var(--pri2); } .vstate.no { color:var(--warn); }
  .judgeTabs .vok { color:#9fe0bd; } .judgeTabs button:not(.on) .vok { color:var(--pri); }
  .judgeTabs .vno { color:#ffd8a8; } .judgeTabs button:not(.on) .vno { color:var(--warn); }
  .full { position:fixed; inset:0; z-index:60; background:#fff; display:flex; flex-direction:column; }
  .full > header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .full > header h3 { margin:0; font-size:16px; flex:1; }
  .full > footer { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; border-top:1px solid var(--line); background:#fafbfc; }
  .rbBody { flex:1; overflow:auto; display:grid; grid-template-columns: minmax(0,1fr) minmax(280px,420px); gap:16px; padding:16px; }
  .rbBody.nophoto { grid-template-columns: minmax(0,520px); justify-content:center; }
  .rbPhoto { overflow:auto; border:1px solid var(--line); border-radius:8px; background:#f1f3f5; min-height:200px; }
  .rbPhoto img { width:100%; display:block; }
  .rbHelp { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .rbRow { display:grid; grid-template-columns:28px 70px 1fr auto; align-items:center; gap:8px; padding:10px 8px; border-bottom:1px solid #eef1f4; cursor:pointer; border-radius:6px; }
  .rbRow input { width:22px; height:22px; margin:0; }
  .rbRow .no { font-weight:700; font-size:18px; }
  .rbRow .val { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rbRow.done { background:#eef8f2; } .rbRow.done .val { color:var(--pri2); }
  .rbRow .missing { color:var(--bad); }
  .imgView { flex:1; overflow:auto; background:#111; }
  .imgView img { max-width:none; width:100%; display:block; }
  @media (max-width:760px){ .rbBody { grid-template-columns:1fr; } .rbPhoto { max-height:38vh; } }
  .entryGrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:20px; align-items:start; }
  .sheetPane { position:sticky; top:76px; }
  .sheetImg { max-height:calc(100vh - 150px); overflow:auto; border:1px solid var(--line); border-radius:8px; background:#f1f3f5; }
  .sheetImg img { width:100%; display:block; }
  .sheetEmpty { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; border:2px dashed #c9d1da; border-radius:10px; padding:30px 18px; cursor:pointer; background:#fafbfc; }
  .sheetEmpty:hover { border-color:var(--pri); }
  .primaryLike { background:var(--pri); color:#fff; border-color:var(--pri); margin-top:6px; }
  .stepHead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .step { width:22px; height:22px; border-radius:50%; background:var(--pri); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .rbFoot { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; }
  .entryGrid.noPhotos { grid-template-columns:minmax(0,900px); }
  .entryPane.rbOn { background:#fbfdfc; }
  tr.ticked td { background:#eaf7ef; }
  .tick { width:20px; height:20px; }
  @media (max-width:1000px){ .entryGrid { grid-template-columns:1fr; } .sheetPane { position:static; } .sheetImg { max-height:45vh; } }
  @media (max-width:760px){ header.bar { position:static; } .sheetPane { position:sticky; top:0; z-index:4; background:#fff; padding-bottom:6px; } .sheetImg { max-height:30vh; } .sheetEmpty { padding:18px 12px; } }
  .ovCounts { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .st { display:inline-block; padding:3px 9px; border-radius:12px; font-size:12px; font-weight:600; white-space:nowrap; }
  .st.grey { background:#eef1f4; color:#5b6875; } .st.work { background:#e7f0fb; color:#1f4f8a; } .st.warn { background:#fff1e0; color:#9a4a00; }
  .st.ready { background:#e3f4ea; color:var(--pri2); } .st.done { background:#ede7f6; color:#4a2a7a; }
  .pill.onair { background:#b42318; color:#fff; font-size:10px; letter-spacing:.05em; border:0; cursor:pointer; padding:3px 8px; vertical-align:middle; }
  .pill.onair:hover { background:#8f1c13; }
  .chips { display:flex; gap:5px; }
  .chip { min-width:38px; height:30px; padding:0 7px; border-radius:15px; font-weight:700; font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:2px; border:1px solid #d5dbe1; background:#fff; color:#8a96a3; }
  .chip.part { background:#e7f0fb; border-color:#bcd3f0; color:#1f4f8a; }
  .chip.ent { background:#fff1e0; border-color:#f3cf9f; color:#9a4a00; }
  .chip.ver { background:var(--pri); border-color:var(--pri); color:#fff; }
  .chip .ph { font-size:11px; }
  .legend { margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; }
  .legend .chip { min-width:26px; height:22px; font-size:11px; }
  .tbl.ov td { padding:8px 6px; vertical-align:middle; }
  .tbl.ov .btns { display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  tr.dndRow td { color:#9aa4ae; background:#f6f7f9; }
  tr.dndRow b { text-decoration:line-through; }
  .pill.dnd { background:#eef1f4; color:#5b6875; margin-left:6px; }
  button.mini { padding:3px 8px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .dndLbl { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); }
  .slot { display:inline-flex; flex-direction:column; align-items:center; gap:3px; }
  .cam { display:inline-flex; align-items:center; justify-content:center; width:38px; height:24px; border-radius:12px; border:1px dashed #b8c2cc; font-size:13px; cursor:pointer; background:#fff; position:relative; }
  .cam span { filter:grayscale(1); opacity:.55; }
  .cam.has { border-style:solid; border-color:var(--pri); background:#e3f4ea; }
  .cam.has span { filter:none; opacity:1; }
  .cam.has::after { content:'✓'; position:absolute; right:-4px; top:-6px; background:var(--pri); color:#fff; border-radius:50%; width:14px; height:14px; font-size:9px; display:flex; align-items:center; justify-content:center; }
  .cam.busy { opacity:.5; }
  .cam.flash { animation:camflash .9s; }
  @keyframes camflash { 0%{ transform:scale(1.35); box-shadow:0 0 0 6px rgba(20,108,67,.25);} 100%{ transform:none; box-shadow:none; } }
  .legend .cam { width:28px; height:20px; font-size:11px; }
  .cfBody { flex:1; overflow:auto; display:grid; grid-template-columns:minmax(260px,360px) minmax(0,1fr); gap:16px; padding:16px; }
  .cfLabel { background:#fafbfc; border:1px solid var(--line); border-radius:10px; padding:16px; align-self:start; }
  .cfComp { font-size:24px; font-weight:800; color:var(--pri2); line-height:1.2; margin-top:2px; }
  .cfJudge { font-size:18px; font-weight:700; margin-top:4px; }
  .cfNos { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .cfImg { overflow:auto; border:1px solid var(--line); border-radius:8px; background:#f1f3f5; }
  .cfImg img { width:100%; display:block; }
  .full footer .cfOk { padding:10px 18px; font-size:16px; }
  @media (max-width:760px){ .cfBody { grid-template-columns:1fr; } .cfImg { max-height:45vh; } .cfComp { font-size:20px; } }
  .cfJudges { display:flex; flex-direction:column; gap:6px; }
  .cfJ { text-align:left; padding:10px 12px; border-radius:8px; display:flex; flex-direction:column; gap:1px; position:relative; }
  .cfJ small { color:var(--muted); font-size:12px; } .cfJ b { font-size:17px; }
  .cfJ.on { border:2px solid var(--pri); background:#e3f4ea; color:var(--ink); }
  .cfJ.on b { color:var(--pri2); }
  .cfHas { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--warn); font-weight:600; }
  .labOk { background:#e3f4ea; color:var(--pri2); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .labOk small { color:var(--ink); }
  .printBox { border:1px solid var(--line); background:#fafbfc; border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  tr.ovRow { cursor:pointer; } tr.ovRow:hover td { background:#f6f9fc; }
  .jCards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px; }
  .jCard { display:flex; align-items:center; gap:12px; text-align:left; padding:10px; border-radius:10px; }
  .jCard:hover { border-color:var(--pri); background:#f7fbf9; }
  .jcThumb { width:64px; height:80px; flex:none; border-radius:6px; border:1px dashed #c9d1da; display:flex; align-items:center; justify-content:center; font-size:22px; color:#9aa4ae; overflow:hidden; background:#fafbfc; font-weight:700; }
  .jcThumb.has { border-style:solid; } .jcThumb img { width:100%; height:100%; object-fit:cover; } .jcThumb.none { filter:grayscale(1); opacity:.6; }
  .jcTx { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; } .jcTx small { color:var(--muted); } .jcTx b { font-size:16px; } .jcTx .st { align-self:flex-start; }
  .jcGo { color:var(--pri); font-weight:600; font-size:13px; white-space:nowrap; }
  .tblwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .nm { display:none; }
  #pv { pointer-events:none; }
  #presentOv { position:fixed; inset:0; z-index:50; background:#000; display:none; }
  #presentOv.on { display:block; }
  #presentOv iframe { border:0; width:100%; height:100%; display:block; }
  #presentOv .x { position:absolute; top:10px; right:10px; z-index:2; background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:20px; padding:6px 14px; font-size:14px; }
  #povInfo { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:#fff; font-size:14px; background:rgba(0,0,0,.6); padding:6px 14px; border-radius:14px; pointer-events:none; transition:opacity 1s; text-align:center; max-width:90%; }
  button.present { width:100%; padding:12px; font-weight:600; margin-top:8px; }
  @media (max-width: 760px) {
    body { font-size:15px; }
    input, select, textarea { font-size:16px; }
    header.bar { padding:8px 10px; gap:8px; }
    .brand { font-size:15px; }
    header.bar > label.muted { order:4; flex:1 1 100%; display:flex; align-items:center; gap:8px; min-width:0; }
    #editSel { width:100%; max-width:100%; }
    nav#tabs { order:5; width:100%; overflow-x:auto; margin-left:0; flex-wrap:nowrap; }
    nav#tabs button { white-space:nowrap; padding:8px 10px; }
    .spacer, #dispStatus, #openDisp { display:none; }
    main { padding:10px; }
    .card { padding:12px; border-radius:8px; }
    .row { gap:10px; }
    .row label { flex:1 1 140px; }
    .row label input, .row label select { width:100%; }
    .tbl.dancers thead { display:none; }
    .tbl.dancers tr { display:grid; grid-template-columns:24px 84px 1fr 40px; gap:6px; padding:8px 0; border-bottom:1px solid #eef1f4; align-items:center; }
    .tbl.dancers td { border:0; padding:0; }
    .tbl.dancers td:nth-child(4) { grid-column:2 / 4; }
    .tbl.dancers td:nth-child(5) { grid-column:4; }
    .tbl.dancers td:nth-child(6) { grid-row:1; grid-column:4; }
    .tbl.dancers .w-s { max-width:none; }
    .nm { display:block; font-size:12px; color:var(--muted); font-weight:400; }
    .hide-m { display:none; }
    .judgeTabs button { flex:1 1 30%; padding:8px 6px; }
    .showgrid > div:first-child { order:2; }
    #nextBtn { position:sticky; bottom:10px; z-index:3; box-shadow:0 6px 18px rgba(0,0,0,.25); }
    .ctl.keys { display:none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">☘ Feis Live Results <span id="ver" class="muted" style="font-size:11px;font-weight:400">v1.15</span></div>
  <label class="muted">Editing&nbsp;<select id="editSel"></select></label>
  <button id="newComp">+ New competition</button>
  <nav id="tabs">
    <button data-tab="overview">Overview</button>
    <button data-tab="scores">Enter scores</button>
    <button data-tab="show">Show on screen</button>
    <span class="tabSep"></span>
    <button data-tab="setup">Setup</button>
    <button data-tab="settings">Settings &amp; backup</button>
  </nav>
  <div class="spacer"></div>
  <span id="dispStatus" class="status off">Display not open</span>
  <button id="openDisp" class="primary">Open display window</button>
</header>
<main id="main"></main>
<div id="presentOv"><iframe id="pov" title="Presentation"></iframe><button class="x" id="povX">✕ Exit</button><div id="povInfo"></div></div>

<script>
/* ============================================================
   Feis Live Results — runs fully offline in one file.
   Data is saved in this browser (localStorage) on every change.
   ============================================================ */
const NO_PHOTOS = true;   // the no-photo edition sets this to true

const PhotoDB = (() => {

  return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)).catch(() => {}) };

function shrinkPhoto(file, max, q){

const labelPayload = (c, j) => `F1|${c.id}|${j}`;   // short = small, easy-to-read QR
function readLabel(file){
  return new Promise(res => {
    if (typeof jsQR !== 'function') return res(null);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      for (const max of [2400, 1600, 1000]) {
        const k = Math.min(1, max/Math.max(img.width, img.height)), w = Math.round(img.width*k), h = Math.round(img.height*k);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d', { willReadFrequently:true }); cx.drawImage(img, 0, 0, w, h);
        const hit = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:'dontInvert' });
        if (hit && hit.data && hit.data.startsWith('F1|')) {
          const [, id, j] = hit.data.split('|'); const c = getComp(id);
          return res(c && +j < c.judges.length ? { c, j:+j } : { unknown: true });
        }
      }
      res(null);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

/* ---------------- Read-back verification ---------------- */
function entryText(c, j, d){
  const e = c.scores[j]?.[d.id];
  if (c.entry === 'place') { const v = (e?.place ?? '').toString().trim(); return v ? ord(+v) || v : ''; }
  const r = Array.from({length:c.rounds}, (_, i) => (e?.r?.[i] ?? '').toString().trim());
  return r.some(x => x === '') ? '' : r.join(' + ');
}
const sigOf = (c, j) => JSON.stringify([c.entry, c.rounds, live(c).map(d => [d.id, entryText(c, j, d)])]);
function isVerified(c, j){ const v = c.verified?.[j]; return !!v && v.sig === sigOf(c, j); }

/* ---------------- Scoring ---------------- */
const pointsAt = p => state.settings.points[p-1] ?? 0;
function sharedPoints(start, k){ let s=0; for(let i=0;i<k;i++) s+=pointsAt(start+i); return r2(s/k); }

function judgeResults(c, j){
  const out = {}; const sc = c.scores[j] || {};
  if (c.entry === 'place') {
    const list = [];
    live(c).forEach(d => { const p = num(sc[d.id]?.place); const ok = Number.isInteger(p) && p>0; out[d.id] = { total:null, rank: ok?p:null, pts:null, tie:false }; if(ok) list.push({id:d.id,p}); });
    const counts = {}; list.forEach(x => counts[x.p] = (counts[x.p]||0)+1);
    list.forEach(x => { const k = counts[x.p]; out[x.id].pts = sharedPoints(x.p, k); out[x.id].tie = k>1; });
  } else {
    const list = [];
    live(c).forEach(d => {
      const r = sc[d.id]?.r || []; let t=0, ok=true;
      for (let i=0;i<c.rounds;i++){ const v=num(r[i]); if(isNaN(v)){ ok=false; break; } t+=v; }
      out[d.id] = { total: ok ? r2(t) : null, rank:null, pts:null, tie:false };
      if (ok) list.push({ id:d.id, t:r2(t) });
    });
    list.sort((a,b) => b.t-a.t);
    let i=0;
    while (i<list.length){
      let k=1; while (i+k<list.length && list[i+k].t===list[i].t) k++;
      const pts = sharedPoints(i+1, k);
      for (let m=0;m<k;m++){ const o=out[list[i+m].id]; o.rank=i+1; o.pts=pts; o.tie=k>1; }
      i+=k;
    }
  }
  return out;
}
function judgeComplete(c, j){ const r = judgeResults(c,j); return live(c).filter(d => r[d.id].pts!=null).length; }
function overall(c){
  const jr = c.judges.map((_,j) => judgeResults(c,j));
  const rows = live(c).map(d => {
    let tot=0, complete=true;
    const pts = jr.map(r => { const p = r[d.id]?.pts; if (p==null) complete=false; else tot+=p; return p ?? null; });
    return { d, pts, total:r2(tot), complete, place:null, tie:false };
  });
  const ranked = rows.filter(r => r.complete).sort((a,b) => b.total-a.total);
  ranked.forEach((r,i) => {
    if (i>0 && ranked[i-1].total===r.total){ r.place = ranked[i-1].place; r.tie = ranked[i-1].tie = true; }
    else r.place = i+1;
  });
  return { jr, rows, ranked };
}
const placesN = c => c.places>0 ? c.places : Math.ceil(live(c).length/2);
function resultList(c){ const N=placesN(c); return overall(c).ranked.filter(r => r.place<=N); }

const SHELL = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Results Display</title><style>${DISPLAY_CSS}</style></head>
<body><div id="root"></div><div id="hint">Double-click or press F for full screen</div><script>
function fs(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }
document.addEventListener('dblclick', fs);
document.addEventListener('keydown', function(e){
  if(e.key==='f'||e.key==='F'){ fs(); return; }
  try { var h = window.opener || (window.parent!==window ? window.parent : null); if(h && h.feisKey && h.feisKey(e.key)) e.preventDefault(); } catch(_){}
});
document.addEventListener('click', function(e){ try { if(window.parent!==window && window.parent.feisTap) window.parent.feisTap(e.clientX/window.innerWidth); } catch(_){} });
if(window.frameElement){ document.getElementById('hint').style.display='none'; }
setTimeout(function(){ var h=document.getElementById('hint'); if(h) h.style.opacity=0; }, 5000);
<\/script></body></html>`;

function logoHTML(src){ return `<div class="logo">${src ? `<img src="${src}" alt="">` : ''}</div>`; }
function frame(inner){
  const s = state.settings;
  return `<div class="stage" style="--bg:${esc(s.bg)};--acc:${esc(s.acc)}"><div class="band"></div><div class="content">${inner}</div><div class="band"></div></div>`;
}
function header(c){
  const s = state.settings;
  return `<div class="top">${logoHTML(s.logoL)}<div class="titles"><div class="ev">${esc(s.eventName)}</div><h1>${esc(c.name)}</h1></div>${logoHTML(s.logoR)}</div><div class="rule"></div>`;
}
function rowH(n){ return Math.max(2.2, Math.min(8, 68/(n+1.4))) + 'vh'; }

function titleHTML(c, sub){
  const s = state.settings;
  return frame(`<div class="hero"><div class="logos">${logoHTML(s.logoL)}${logoHTML(s.logoR)}</div>
    <div><div class="ev">${esc(s.eventName)}</div>${c ? `<h1>${esc(c.name)}</h1>` : ''}${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>`);
}
function gridHTML(c, anim){
  const v=c.view, D=live(c).length, J=c.judges.length;
  if (!D) return frame(header(c) + `<div class="empty">No dancers entered yet</div>`);
  const jr = c.judges.map((_,j) => judgeResults(c,j));
  const newest = anim && v.gridStep>0 && v.lastReveal==='cell' ? v.gridStep-1 : -1;
  const totAnim = anim && v.lastReveal==='totals';
  let h = `<table class="grid" style="--rh:${rowH(D)}"><colgroup><col style="width:15%">${c.judges.map(()=>'<col>').join('')}<col style="width:17%"></colgroup>
    <thead><tr><th>Dancer No</th>${c.judges.map((n,j)=>`<th><span class="aw">Adjudicator</span><span class="jw">Judge</span> ${j+1}<small>${esc(n)}</small></th>`).join('')}<th>Grid Total</th></tr></thead><tbody>`;
  live(c).forEach((d,i) => {
    h += `<tr><td class="no">${esc(d.no)}</td>`;
    let tot=0, allShown=true, complete=true;
    for (let j=0;j<J;j++){
      const idx=j*D+i, shown = idx < v.gridStep, p = jr[j][d.id]?.pts;
      if (p==null) complete=false; else tot+=p;
      if (!shown) allShown=false;
      h += shown ? `<td class="${idx===newest?'new':''}">${p==null?'—':fmt(p)}</td>` : `<td class="hid"></td>`;
    }
    h += v.showTotals ? `<td class="tot ${totAnim?'new':''}">${complete?fmt(r2(tot)):'—'}</td>` : `<td class="hid"></td>`;
    h += `</tr>`;
  });
  return frame(header(c) + h + `</tbody></table>`);
}
function resultsHTML(c, anim){
  const v=c.view, list=resultList(c), L=list.length, k=Math.min(v.resStep, L);
  if (!L) return frame(header(c) + `<div class="empty">Results not ready</div>`);
  const shown = i => v.order==='bottom' ? i >= L-k : i < k;
  const newest = anim && k>0 && v.lastReveal==='row' ? (v.order==='bottom' ? L-k : k-1) : -1;
  const allAnim = anim && v.lastReveal==='allrows';
  let h = `<table style="--rh:${rowH(L)}"><colgroup><col style="width:9%"><col style="width:12%"><col style="width:32%"><col><col style="width:13%"></colgroup>
    <thead><tr><th>Place</th><th>Dancer No</th><th>Competitor</th><th class="sch">Dance School</th><th>Grid Total</th></tr></thead><tbody>`;
  list.forEach((r,i) => {
    const s = shown(i);
    const cls = !s ? 'hidrow' : `p${r.place} ${(i===newest||allAnim)?'newrow':''}`;
    h += `<tr class="${cls}"><td class="place">${s?ord(r.place)+(r.tie?'=':''):''}</td><td class="no">${s?esc(r.d.no):''}</td><td class="left">${s?esc(r.d.name):''}</td><td class="left sch">${s?esc(r.d.school):''}</td><td class="tot">${s?fmt(r.total):''}</td></tr>`;
  });
  return frame(header(c) + h + `</tbody></table>`);
}
function dispHTML(anim){
  const c = liveComp();
  if (!c) return titleHTML(null, 'Results will appear here');
  switch (c.view.screen){
    case 'grid': return gridHTML(c, anim);
    case 'results': return resultsHTML(c, anim);
    case 'blank': return titleHTML(null, 'Results will appear here shortly');
    default: return titleHTML(c, 'Results');
  }
}

let dispWin = null;
function ensureShell(doc){ if (!doc.getElementById('root')) { doc.open(); doc.write(SHELL); doc.close(); } }
function pushTo(doc){
  if (!doc) return; const root = doc.getElementById('root'); if (!root) return;
  const c = liveComp(); const flash = c ? c.view.flash : 0;
  const anim = !!flash && doc.__flash !== flash;
  const html = dispHTML(anim);
  if (html === doc.__html) return;
  root.innerHTML = html; doc.__html = html; doc.__flash = flash;
}
function pushDisplay(){
  if (dispWin && !dispWin.closed) { try { pushTo(dispWin.document); } catch(e){} }
  const pv = document.getElementById('pv');
  if (pv && pv.contentDocument) pushTo(pv.contentDocument);
  const pov = document.getElementById('pov');
  if (pov.__ready && document.getElementById('presentOv').classList.contains('on')) pushTo(pov.contentDocument);
  updateStatus();
}
function openDisplay(){
  dispWin = window.open('', 'feisLiveDisplay', 'width=1280,height=720');
  if (!dispWin) { toast('A separate display window can’t open here — use “Present on this device” on the Show tab instead.'); return; }
  ensureShell(dispWin.document); dispWin.document.__html = null;
  pushDisplay(); dispWin.focus();
}
function updateStatus(){
  const el = document.getElementById('dispStatus'); const on = dispWin && !dispWin.closed;
  el.className = 'status ' + (on?'on':'off'); el.textContent = on ? 'Display window open' : 'Display not open';
  document.getElementById('openDisp').textContent = on ? 'Bring display to front' : 'Open display window';
}
setInterval(updateStatus, 1500);

/* ---------------- Show controls ---------------- */
function flash(c, kind){ c.view.flash = (c.view.flash||0)+1; c.view.lastReveal = kind; }
function act(fn){ const c = liveComp(); if(!c) return; fn(c, c.view); save(); pushDisplay(); if (state.tab==='show') updateShowCtl(); }
async function okToReveal(c, judges){
  const bad = judges.filter(j => !isVerified(c, j) && !(c.view.ov||{})[j]);
  if (!bad.length) return true;
  const names = bad.map(j => `Adjudicator ${j+1}`).join(', ');
  const go = await dialog({ title:'Scores not verified', text:`${names} ${bad.length>1?'haven’t':'hasn’t'} been read back yet. Reveal anyway?`, ok:'Reveal anyway', danger:true });
  if (go) { c.view.ov = c.view.ov || {}; bad.forEach(j => c.view.ov[j] = true); save(); }
  return go;
}
async function next(){
  const c0 = liveComp(); if (!c0) return;
  const v0 = c0.view, D0 = live(c0).length, J0 = c0.judges.length;
  if (v0.screen==='grid' && v0.gridStep < D0*J0 && D0 && !(await okToReveal(c0, [Math.floor(v0.gridStep/D0)]))) return;
  if ((v0.screen==='results' || (v0.screen==='grid' && v0.gridStep>=D0*J0)) && !(await okToReveal(c0, c0.judges.map((_,j)=>j)))) return;
  act((c,v) => {
    const D=live(c).length, J=c.judges.length, L=resultList(c).length;
    if (v.screen==='title' || v.screen==='blank'){ v.screen='grid'; return; }
    if (v.screen==='grid'){
      if (v.gridStep < D*J){ v.gridStep++; flash(c,'cell'); }
      else if (!v.showTotals){ v.showTotals=true; flash(c,'totals'); }
      else { v.screen='results'; }
      return;
    }
    if (v.screen==='results' && v.resStep < L){ v.resStep++; flash(c,'row'); }
  });
}
function back(){
  act((c,v) => {
    if (v.screen==='grid'){ if (v.showTotals) v.showTotals=false; else if (v.gridStep>0) v.gridStep--; }
    else if (v.screen==='results' && v.resStep>0) v.resStep--;
    v.lastReveal = null;
  });
}
function setScreen(s){ act((c,v) => { v.screen=s; v.lastReveal=null; }); }
window.feisKey = function(key){
  if (document.querySelector('.dlgOv, .full')) return false;
  if (key===' ' || key==='ArrowRight' || key==='PageDown' || key==='Enter'){ next(); return true; }
  if (key==='ArrowLeft' || key==='PageUp' || key==='Backspace'){ back(); return true; }
  const m = { t:'title', g:'grid', r:'results', h:'blank' }[key.toLowerCase()];
  if (m){ setScreen(m); return true; }
  return false;
};
function startPresent(){
  const ov = document.getElementById('presentOv'), pov = document.getElementById('pov'), info = document.getElementById('povInfo');
  ov.classList.add('on');
  if (!pov.__ready) { pov.onload = () => { pov.__ready = true; pov.contentDocument.__html = null; pushDisplay(); }; pov.srcdoc = SHELL; }
  else { pov.contentDocument.__html = null; pushDisplay(); }
  try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch(_){}
  info.innerHTML = 'Tap the right side for <b>Next</b> · left side for <b>Back</b>' + (innerHeight > innerWidth ? '<br>Turn your device sideways for the best view' : '');
  info.style.opacity = 1; clearTimeout(info.__t); info.__t = setTimeout(() => info.style.opacity = 0, 5000);
}
function stopPresent(){
  document.getElementById('presentOv').classList.remove('on');
  try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.webkitFullscreenElement) document.webkitExitFullscreen(); } catch(_){}
  if (state.tab==='show') updateShowCtl();
}
window.feisTap = x => { if (!document.getElementById('presentOv').classList.contains('on')) return; x < 0.3 ? back() : next(); };
document.getElementById('povX').onclick = stopPresent;
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && document.getElementById('presentOv').classList.contains('on')) { stopPresent(); return; }
  if (state.tab!=='show') return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.target.tagName==='BUTTON' && (e.key===' '||e.key==='Enter')) { e.preventDefault(); }
  if (window.feisKey(e.key)) e.preventDefault();
});

/* ---------------- Control UI ---------------- */
const main = document.getElementById('main');
function renderHeader(){
  const sel = document.getElementById('editSel');
  sel.innerHTML = state.comps.map(c => `<option value="${c.id}" ${c.id===state.editId?'selected':''}>${esc(c.name)}</option>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===state.tab));
}
function render(){
  renderHeader();
  ({ overview:renderOverview, setup:renderSetup, scores:renderScores, show:renderShow, settings:renderSettings }[state.tab] || renderOverview)();
}

document.getElementById('editSel').onchange = e => { state.editId = e.target.value; state.judgeTab=-1; save(); render(); };
document.getElementById('newComp').onclick = async () => {
  const name = await askText('New competition', 'e.g. Under 11 Open Championship'); if (!name) return;
  const c = newComp(name.trim()); const prev = editComp();
  if (prev){ c.judges = prev.judges.slice(); c.rounds = prev.rounds; c.entry = prev.entry; }
  state.comps.push(c); state.editId = c.id; state.tab='setup'; save(); render();
};
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { state.tab=b.dataset.tab; save(); render(); });
document.getElementById('openDisp').onclick = () => (dispWin && !dispWin.closed) ? dispWin.focus() : openDisplay();

function compStatus(c){
  const D=live(c).length, J=c.judges.length, v=c.view, L=resultList(c).length;
  const ent=c.judges.map((_,j)=>judgeComplete(c,j)), full=ent.filter(n=>D && n===D).length;
  const vc=c.judges.filter((_,j)=>isVerified(c,j)).length;
  if (!D) return ['Setting up','grey'];
  if (v.screen==='results' && L && v.resStep>=L) return ['Announced','done'];
  if (full===J && vc===J) return ['Ready to announce','ready'];
  if (full===J) return [`Needs read-back · ${vc}/${J} checked`,'warn'];
  if (ent.some(n=>n>0)) return [`Entering sheets · ${full}/${J} in`,'work'];
  return ['Waiting for sheets','grey'];
}
function renderOverview(){
  const counts = {};
  state.comps.forEach(c => { const k = compStatus(c)[1]; counts[k] = (counts[k]||0)+1; });
  main.innerHTML = `
  <section class="card"><h2>All competitions <span class="muted">— where each one stands. Tap a sheet number to type it in.</span></h2>
    ${photosOn() ? `<div class="hint">📷 <b>Sheets arriving in a stack?</b> Tap the camera under any sheet number — or <label class="btnlike primaryLike" style="margin:0 4px">📷 Add sheet photo<input type="file" accept="image/*" capture="environment" id="ovCam" hidden></label> and pick which sheet it is after. You stay on this page, so you can snap a whole stack in any order.</div>` : ''}
    <div class="ovCounts">${[['work','being entered'],['warn','need read-back'],['ready','ready to announce'],['done','announced'],['grey','waiting / setting up']].filter(([k])=>counts[k]).map(([k,l])=>`<span class="st ${k}">${counts[k]} ${l}</span>`).join('')}</div>
    <div class="tblwrap"><table class="tbl ov"><thead><tr><th>Competition</th><th class="num hide-m">Dancers</th><th>Score sheets</th><th>Status</th><th></th></tr></thead><tbody>
    ${state.comps.map(c => { const [st,k] = compStatus(c), D=live(c).length;
      return `<tr class="ovRow" data-row="${c.id}"><td><b>${esc(c.name)}</b>${c.id===state.liveId?' <button class="pill onair" data-onair title="Go to Show on screen">ON SCREEN ▸</button>':''}<span class="nm">${D} dancers</span></td>
        <td class="num hide-m">${D}</td>
        <td><div class="chips">${c.judges.map((n,j)=>{ const e=judgeComplete(c,j), ver=isVerified(c,j);
          const cls = ver?'ver':(D&&e===D?'ent':(e>0?'part':'none'));
          const tip = ver?'verified':(D&&e===D?'entered, not read back':(e>0?`${e}/${D} entered`:'not entered'));
          return `<span class="slot"><button class="chip ${cls}" data-go="${c.id}" data-j="${j}" title="Adjudicator ${j+1}: ${esc(n)} — ${tip}">${j+1}</button>${photosOn() ? `<label class="cam" data-ph="${c.id}:${j}" title="Photo of Adjudicator ${j+1}'s sheet"><span>📷</span><input type="file" accept="image/*" capture="environment" data-cam="${c.id}:${j}" hidden></label>` : ''}</span>`; }).join('')}</div></td>
        <td><span class="st ${k}">${st}</span></td>
        <td class="num"><div class="btns"><button data-enter="${c.id}">Open</button><button data-live="${c.id}">Show</button></div></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="legend muted"><span class="chip none">1</span> not in yet <span class="chip part">1</span> partly typed <span class="chip ent">1</span> typed, not read back <span class="chip ver">1</span> verified${photosOn() ? ' · <span class="cam">📷</span> no photo yet <span class="cam has">📷</span> photo on file' : ''}</div>
  </section>`;
  const go = (c, j) => { state.editId=c.id; state.judgeTab=j; state.tab='scores'; save(); render(); scrollTo(0,0); };
  main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(getComp(b.dataset.go), +b.dataset.j));
  main.querySelectorAll('[data-enter]').forEach(b => b.onclick = () => go(getComp(b.dataset.enter), -1));
  const toShow = () => { state.tab='show'; save(); render(); scrollTo(0,0); };
  main.querySelectorAll('[data-onair]').forEach(b => b.onclick = toShow);
  main.querySelectorAll('tr.ovRow').forEach(tr => tr.onclick = e => { if (e.target.closest('button, label, input, a')) return; go(getComp(tr.dataset.row), -1); });
  main.querySelectorAll('[data-live]').forEach(b => b.onclick = () => { state.liveId=b.dataset.live; state.tab='show'; save(); render(); pushDisplay(); scrollTo(0,0); });
  if (photosOn()) {
    main.querySelectorAll('[data-ph]').forEach(async el => { const [id,j]=el.dataset.ph.split(':'); const c=getComp(id); if (c && await getPhoto(c,+j)) el.classList.add('has'); });
    const oc = document.getElementById('ovCam');
    if (oc) oc.onchange = async () => { const f = oc.files[0]; if (!f) return;
      const c0 = state.comps.find(c => compStatus(c)[1] !== 'done' && live(c).length) || state.comps[0];
      try { const to = await savePhoto(c0, 0, f); if (to) { const tl = main.querySelector(`[data-ph="${to.c.id}:${to.j}"]`); if (tl) { tl.classList.add('has','flash'); setTimeout(()=>tl.classList.remove('flash'), 900); } toast(`📷 Saved: ${shortName(to.c)} · Adjudicator ${to.j+1}`); } }
      catch(_) { toast('Could not save the photo on this device.'); }
      oc.value = ''; };
    main.querySelectorAll('[data-cam]').forEach(inp => inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return; const [id,j] = inp.dataset.cam.split(':'); const c = getComp(id);
      const lab = inp.closest('.cam'); lab.classList.add('busy');
      try { const to = await savePhoto(c, +j, f); if (to) { const tl = main.querySelector(`[data-ph="${to.c.id}:${to.j}"]`) || lab; tl.classList.add('has','flash'); setTimeout(()=>tl.classList.remove('flash'), 900);
        toast(`📷 Saved: ${shortName(to.c)} · Adjudicator ${to.j+1}`); } }
      catch(_) { toast('Could not save the photo on this device.'); }
      lab.classList.remove('busy'); inp.value = '';
    });
  }
}
function renderSetup(){
  const c = editComp();
  if (!c){ main.innerHTML = `<div class="card">No competitions yet — click “+ New competition”.</div>`; return; }
  const opt = (vals, cur, lab=x=>x) => vals.map(v => `<option value="${v}" ${String(v)===String(cur)?'selected':''}>${lab(v)}</option>`).join('');
  main.innerHTML = `
  <section class="card"><h2>Competition</h2>
    <div class="row">
      <label>Name <input id="cName" size="40" value="${esc(c.name)}"></label>

      <label>Score sheets give <select id="cE">${opt(['raw','place'], c.entry, v => v==='raw'?'Raw marks':'Placings')}</select></label>
      <label>Rounds per sheet <select id="cR" ${c.entry==='place'?'disabled':''}>${opt([1,2,3], c.rounds)}</select></label>

    </div>
    <div class="row">${c.judges.map((n,i) => `<label>Adjudicator ${i+1} name <input data-judge="${i}" value="${esc(n)}"></label>`).join('')}</div>
    <div class="printBox"><b>Before the event — print for the adjudicators</b>
      <div class="row" style="margin:8px 0 4px"><button id="shThis">🖨 Score sheets — this competition</button><button id="shAll">🖨 Score sheets — all competitions</button></div>
      <div class="muted">One page per adjudicator, with the competition, adjudicator and dancer numbers already filled in${NO_PHOTOS ? '' : ', plus a code that files the photo automatically'}.</div>
      ${NO_PHOTOS ? '' : `<div class="row" style="margin:10px 0 4px"><button id="lblThis">🏷 Stick-on labels — this competition</button><button id="lblAll">🏷 Stick-on labels — all competitions</button></div>
      <div class="muted">For sheets you don’t print yourself: one sticker per adjudicator’s sheet (Avery 5160).</div>`}
    </div>
    <div class="row"><button id="dupComp">Duplicate setup for next competition</button><button id="delComp" class="danger">Delete this competition</button></div>
  </section>

        <div class="screens">
          <button data-screen="title">Title</button><button data-screen="grid">Score grid</button>
          <button data-screen="results">Results</button><button data-screen="blank">Holding screen</button>
        </div>
        <button id="nextBtn" class="big primary">Next ▶<small>Space · → · Page Down · presentation clicker</small></button>
        <button id="backBtn" style="width:100%">◀ Back</button>
        <button id="presentBtn" class="present">⛶ Present on this device (full screen)</button>
        <div id="screenCtl" class="ctl"></div>
        <div id="warn" class="ctl"></div>
        <div class="ctl keys"><b>Shortcuts</b> (also work in the display window)<br><kbd>T</kbd> title · <kbd>G</kbd> grid · <kbd>R</kbd> results · <kbd>H</kbd> holding · <kbd>←</kbd> back<br>In the display window: double-click or <kbd>F</kbd> for full screen.</div>
      </div>
      <div><div class="pvlabel">What the audience sees</div><div id="pvBox"><iframe id="pv" title="preview"></iframe></div></div>
    </div>
  </section>`;
  document.getElementById('liveSel').onchange = e => { state.liveId = e.target.value; save(); pushDisplay(); updateShowCtl(); };
  main.querySelectorAll('[data-screen]').forEach(b => b.onclick = () => setScreen(b.dataset.screen));
  document.getElementById('nextBtn').onclick = next;
  document.getElementById('backBtn').onclick = back;
  document.getElementById('presentBtn').onclick = startPresent;
  const pv = document.getElementById('pv');
  pv.onload = () => { pv.contentDocument.__html=null; pushDisplay(); };
  pv.srcdoc = SHELL;
  sizePreview(); updateShowCtl();
}
function sizePreview(){
  const box = document.getElementById('pvBox'), pv = document.getElementById('pv'); if (!box||!pv) return;
  const s = box.clientWidth/1280; pv.style.transform = `scale(${s})`; box.style.height = (720*s)+'px';
}
window.addEventListener('resize', sizePreview);
function updateShowCtl(){
  const c = liveComp(); if (!c || !document.getElementById('screenCtl')) return;
  const v = c.view, D=live(c).length, J=c.judges.length, L=resultList(c).length;
  main.querySelectorAll('[data-screen]').forEach(b => b.classList.toggle('on', b.dataset.screen===v.screen));
  const ctl = document.getElementById('screenCtl');
  if (v.screen==='grid'){
    const curJ = Math.min(J-1, Math.floor(v.gridStep/Math.max(D,1)));
    ctl.innerHTML = `<div class="progress"><b>Score grid:</b> ${v.gridStep} of ${D*J} scores shown${v.showTotals?' · totals shown':''}</div>
      <div class="btns"><button id="gJudge">Reveal rest of Adjudicator ${curJ+1}</button><button id="gAll">Reveal all scores</button>
      <button id="gTot">${v.showTotals?'Hide':'Show'} grid totals</button><button id="gReset">Hide all</button></div>`;
    document.getElementById('gJudge').onclick = async () => { if (!(await okToReveal(c, [curJ]))) return; act((c,v) => { const end=Math.min(D*J, (Math.floor(v.gridStep/D)+1)*D); if (end>v.gridStep){ v.gridStep=end; flash(c,'cell'); } }); };
    document.getElementById('gAll').onclick = async () => { if (!(await okToReveal(c, c.judges.map((_,j)=>j)))) return; act((c,v) => { v.gridStep=D*J; flash(c,'cell'); }); };
    document.getElementById('gTot').onclick = () => act((c,v) => { v.showTotals=!v.showTotals; if (v.showTotals) flash(c,'totals'); else v.lastReveal=null; });
    document.getElementById('gReset').onclick = () => act((c,v) => { v.gridStep=0; v.showTotals=false; v.lastReveal=null; v.ov={}; });
  } else if (v.screen==='results'){
    ctl.innerHTML = `<div class="progress"><b>Results:</b> ${Math.min(v.resStep,L)} of ${L} places shown</div>
      <label class="muted">Reveal order <select id="rOrder"><option value="top" ${v.order==='top'?'selected':''}>1st place first</option><option value="bottom" ${v.order==='bottom'?'selected':''}>Last place first (build to 1st)</option></select></label>
      <div class="btns"><button id="rAll">Reveal all</button><button id="rReset">Hide all</button></div>`;
    document.getElementById('rOrder').onchange = e => act((c,v) => { v.order=e.target.value; v.lastReveal=null; });
    document.getElementById('rAll').onclick = async () => { if (!(await okToReveal(c, c.judges.map((_,j)=>j)))) return; act((c,v) => { v.resStep=L; flash(c,'allrows'); }); };
    document.getElementById('rReset').onclick = () => act((c,v) => { v.resStep=0; v.lastReveal=null; });
  } else {
    ctl.innerHTML = `<div class="progress">Press <b>Next</b> to go to the score grid. Each press then reveals one score, adjudicator by adjudicator, then the grid totals, then the results.</div>`;
  }
  const warns = [];
  c.judges.forEach((n,j) => { const done = judgeComplete(c,j); if (done<D) warns.push(`Adjudicator ${j+1} (${esc(n)}): ${D-done} score${D-done>1?'s':''} missing`); else if (!isVerified(c,j)) warns.push(`Adjudicator ${j+1} (${esc(n)}): not read back yet`); });
  if (!D) warns.push('No dancers entered for this competition.');
  document.getElementById('warn').innerHTML = warns.length ? `<div class="warn"><b>Check before revealing:</b><br>${warns.join('<br>')}</div>` : `<div class="pill ok">All scores entered and verified</div>`;
}

function renderSettings(){
  const s = state.settings;
  main.innerHTML = `
  <section class="card"><h2>Display look</h2>
    <div class="row">
      <label>Event name (top line on every screen) <input id="sEv" size="40" value="${esc(s.eventName)}"></label>
      <label>Background <input id="sBg" type="color" value="${esc(s.bg)}"></label>
      <label>Accent <input id="sAcc" type="color" value="${esc(s.acc)}"></label>
      <button id="sDefCol">Reset colors</button>
    </div>
    ${NO_PHOTOS ? '' : `<div class="row"><label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:600"><input type="checkbox" id="sPhotos" ${s.photos!==false?'checked':''} style="width:18px;height:18px"> Use photos of score sheets</label>
      <span class="muted" style="padding-bottom:2px">Turn off if photographing sheets isn't allowed. Photos already taken stay on this device.</span></div>`}
    <div class="row">
      ${['L','R'].map(k => `<label>${k==='L'?'Left':'Right'} logo <div class="logoPrev">${s['logo'+k]?`<img src="${s['logo'+k]}">`:'none'}</div>
        <input type="file" accept="image/*" data-logo="${k}" style="max-width:200px"> ${s['logo'+k]?`<button data-rmlogo="${k}">Remove</button>`:''}</label>`).join('')}
    </div>
  </section>
  <section class="card"><h2>Irish points table</h2>
    <p class="muted">Points for 1st, 2nd, 3rd… Tied dancers share the average of the places they occupy (e.g. tied for 3rd/4th = (65+60)/2 = 62.5).</p>
    <textarea id="sPts" rows="3" style="width:100%">${s.points.join(', ')}</textarea>
    <div class="row" style="margin-top:6px"><button id="sPtsSave" class="primary">Save points table</button><button id="sPtsDef">Reset to standard</button></div>
  </section>
  <section class="card"><h2>Backup &amp; export</h2>
    <p class="muted">Everything saves automatically in this browser on this laptop. Download a backup before the event and at breaks, so you can move to another laptop if needed.</p>
    <div class="row">
      <button id="bDown" class="primary">Download backup</button>
      <label>Restore from backup <input type="file" id="bUp" accept=".json,application/json"></label>
      <button id="csv">Export “${esc(editComp()?.name||'')}” results (CSV for Excel)</button>
      <button id="demoReload">Reload demo competitions</button>
      <button id="demoRemove">Remove demo competitions</button>
      <button id="copyRes">Copy results (paste into Excel)</button>
      <button id="wipe" class="danger">Start fresh (delete everything)</button>
    </div>
  </section>`;
  const $ = id => document.getElementById(id);
  $('sEv').oninput = e => { s.eventName=e.target.value; save(); pushDisplay(); };
  $('sBg').oninput = e => { s.bg=e.target.value; save(); pushDisplay(); };
  $('sAcc').oninput = e => { s.acc=e.target.value; save(); pushDisplay(); };
  if ($('sPhotos')) $('sPhotos').onchange = e => { s.photos = e.target.checked; save(); toast(s.photos ? 'Sheet photos turned on.' : 'Sheet photos turned off.'); };
  $('sDefCol').onclick = () => { s.bg=DEFAULT_BG; s.acc=DEFAULT_ACC; save(); renderSettings(); pushDisplay(); };
  main.querySelectorAll('[data-logo]').forEach(inp => inp.onchange = () => { const f=inp.files[0]; if(!f) return; shrinkImage(f, url => { s['logo'+inp.dataset.logo]=url; save(); renderSettings(); pushDisplay(); }); });
  main.querySelectorAll('[data-rmlogo]').forEach(b => b.onclick = () => { s['logo'+b.dataset.rmlogo]=''; save(); renderSettings(); pushDisplay(); });
  $('sPtsSave').onclick = () => { const a=$('sPts').value.split(/[\s,]+/).map(Number).filter(n=>!isNaN(n)); if(a.length<3) return toast('Enter at least 3 numbers.'); s.points=a; save(); pushDisplay(); toast('Points table saved.'); };
  $('sPtsDef').onclick = () => { s.points=DEFAULT_POINTS.slice(); save(); renderSettings(); pushDisplay(); };
  $('bDown').onclick = () => download(`feis-results-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`, JSON.stringify(state), 'application/json');
  $('bUp').onchange = e => { const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload = async () => { let st; try { st=JSON.parse(rd.result); if(!st.comps||!st.settings) throw 0; } catch(_){ return toast('That file is not a valid backup.'); } if(!(await askConfirm('Restore this backup?', 'Everything here will be replaced with the backup.', 'Restore'))) return; state=st; save(); render(); pushDisplay(); toast('Backup restored.'); }; rd.readAsText(f); };
  $('csv').onclick = () => { const c=editComp(); const o=overall(c); const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const lines=[['Place','Dancer No','Name','School',...c.judges,'Grid Total'].map(q).join(',')];
    [...o.rows].sort((a,b)=>(a.place??1e9)-(b.place??1e9)).forEach(r => lines.push([r.place?r.place+(r.tie?'=':''):'', r.d.no, r.d.name, r.d.school, ...r.pts.map(p=>p==null?'':fmt(p)), r.complete?fmt(r.total):''].map(q).join(',')));
    download(`${c.name.replace(/[^\w\- ]+/g,'')}.csv`, '﻿'+lines.join('\r\n'), 'text/csv'); };
  $('demoReload').onclick = async () => { if (!(await askConfirm('Reload the demo?', 'Demo competitions go back to their starting point. Your own competitions are not touched.', 'Reload'))) return;
    state.comps = state.comps.filter(c => !isDemo(c)); const ds = demoComps(); state.comps = ds.concat(state.comps); ds.forEach(finishDemo);
    state.editId = ds[2].id; state.liveId = ds[1].id; save(); toast('Demo reloaded.'); state.tab='overview'; render(); pushDisplay(); };
  $('demoRemove').onclick = async () => { if (!(await askConfirm('Remove demo competitions?', 'Only the “Demo —” competitions are removed. Your own competitions stay.', 'Remove'))) return;
    state.comps = state.comps.filter(c => !isDemo(c)); if (!state.comps.length) state.comps.push(newComp('New competition'));
    if (!getComp(state.editId)) state.editId = state.comps[0].id; if (!getComp(state.liveId)) state.liveId = state.comps[0].id; save(); toast('Demo competitions removed.'); render(); pushDisplay(); };
  $('copyRes').onclick = async () => { const c=editComp(); const o=overall(c);
    const lines=[['Place','Dancer No','Name','School',...c.judges,'Grid Total'].join('\t')];
    [...o.rows].sort((a,b)=>(a.place??1e9)-(b.place??1e9)).forEach(r => lines.push([r.place?r.place+(r.tie?'=':''):'', r.d.no, r.d.name, r.d.school, ...r.pts.map(p=>p==null?'':fmt(p)), r.complete?fmt(r.total):''].join('\t')));
    try { await navigator.clipboard.writeText(lines.join('\n')); toast('Results copied — paste into Excel.'); } catch(_){ toast('Copying isn’t allowed here.'); } };
  $('wipe').onclick = async () => { if(!(await askConfirm('Start fresh?', 'This deletes ALL competitions, scores and settings. Download a backup first if unsure.', 'Delete everything'))) return; const c=newComp('New competition'); state={...defaultState(), comps:[c], editId:c.id, liveId:c.id}; save(); render(); pushDisplay(); };
}
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function shrinkImage(file, cb){
  const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => { const m=400, k=Math.min(1, m/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL('image/png')); }; img.src = rd.result; };
  rd.readAsDataURL(file);
}

// migrate / sanity
if (NO_PHOTOS) { document.getElementById('ver').textContent += ' · no-photo edition'; document.title = 'Feis Live Results (no photos)'; }
if (state.demoV !== 2) {   // swap the old single demo for the multi-competition demo
  const old = state.comps.filter(c => c.demo || c.demoKey || /^Demo — /.test(c.name));
  state.comps = state.comps.filter(c => !old.includes(c));
  const ds = demoComps(); state.comps = ds.concat(state.comps);
  if (!getComp(state.editId)) state.editId = ds[2].id;
  if (!getComp(state.liveId)) state.liveId = ds[1].id;
  state.demoV = 2; state.tab = 'overview';
}
state.comps.forEach(finishDemo);
state.comps.forEach(c => { c.view = Object.assign(newView(), c.view||{}); c.scores = c.scores||{}; });
if (!state.comps.length) state.comps.push(newComp('New competition'));
if (!getComp(state.editId)) state.editId = state.comps[0].id;
if (!getComp(state.liveId)) state.liveId = state.comps[0].id;
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
